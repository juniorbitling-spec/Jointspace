<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joint Space — Assessment Proforma</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --green:#6b8c2a;--green2:#7fa832;--green-light:#eef4d6;--green-mid:#d4e890;
  --ink:#1a2410;--ink2:#3a4a20;--ink3:#6b7a50;--muted:#9aaa80;
  --bg:#f4f7ee;--white:#fff;--surface:#f9fbf4;--border:#dde8c0;--border2:#ccd8a0;
  --red:#c0392b;--red-light:#fde8e6;--amber:#d4820a;--amber-light:#fef3dc;
  --blue:#2563a8;--blue-light:#dbeafe;--shadow:0 2px 8px rgba(107,140,42,0.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',sans-serif;min-height:100dvh;padding-bottom:40px;}
button{font-family:'Nunito',sans-serif;}

/* NAV */
.nav-bar{background:linear-gradient(135deg,#2d4a0e 0%,#5a7a20 100%);position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,0.18);}
.nav-top{display:flex;align-items:center;gap:10px;padding:12px 16px 8px;}
.brand-name{font-size:18px;font-weight:900;color:#fff;line-height:1;}
.brand-sub{font-size:10px;color:rgba(255,255,255,0.65);letter-spacing:0.15em;text-transform:uppercase;margin-top:1px;}
.nav-link{margin-left:auto;font-size:11px;font-weight:800;color:#fff;text-decoration:none;background:rgba(255,255,255,0.15);padding:6px 10px;border-radius:8px;white-space:nowrap;}
.nav-tabs{display:flex;border-top:1px solid rgba(255,255,255,0.12);}
.nav-tab{flex:1;padding:10px 6px;text-align:center;font-size:11px;font-weight:800;color:rgba(255,255,255,0.55);cursor:pointer;border:none;border-bottom:3px solid transparent;background:none;letter-spacing:0.06em;}
.nav-tab.active{color:#fff;border-bottom-color:#a8d030;}
.tab-badge{background:var(--red);color:#fff;font-size:9px;font-weight:900;border-radius:10px;padding:1px 5px;margin-left:4px;display:none;}
.tab-badge.show{display:inline;}
.page{display:none;}.page.active{display:block;}
.wrap{max-width:980px;margin:0 auto;}

/* FORM */
.form-wrap{padding:12px;}
.form-head{background:linear-gradient(90deg,var(--green-light),var(--surface));border-radius:12px;padding:11px 13px;margin-bottom:11px;border:1px solid var(--border);}
.form-head-title{font-family:'Crimson Pro',serif;font-size:18px;font-weight:600;color:var(--ink2);}
.form-head-sub{font-size:12px;color:var(--ink3);font-style:italic;}
.edit-flag{display:none;margin-top:6px;font-size:11px;font-weight:800;color:var(--blue);background:var(--blue-light);border-radius:6px;padding:4px 8px;}
.edit-flag.show{display:inline-block;}
.sec-nav{display:flex;gap:5px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:thin;}
.sec-nav button{flex-shrink:0;background:var(--white);border:1.5px solid var(--border);border-radius:16px;padding:5px 10px;font-size:10px;font-weight:800;color:var(--ink3);cursor:pointer;white-space:nowrap;}
.sec-nav button.filled{border-color:var(--green2);color:var(--green);background:var(--green-light);}
.tools-row{display:flex;gap:6px;margin-bottom:10px;}
.tools-row button{flex:1;background:var(--white);border:1.5px solid var(--border2);border-radius:8px;padding:7px;font-size:11px;font-weight:800;color:var(--ink2);cursor:pointer;}

.section-card{background:var(--white);border:1px solid var(--border);border-radius:13px;margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);scroll-margin-top:110px;}
.section-head{background:linear-gradient(90deg,var(--green-light),var(--surface));padding:10px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;}
.section-num{font-size:10px;font-weight:900;color:var(--green);background:var(--white);border:1.5px solid var(--green-mid);border-radius:5px;padding:2px 6px;}
.section-title{font-size:13px;font-weight:800;color:var(--ink);flex:1;}
.section-toggle{font-size:14px;color:var(--green);transition:transform 0.2s;}
.section-card.open .section-toggle{transform:rotate(180deg);}
.section-body{padding:12px 13px;display:none;}
.section-card.open .section-body{display:block;}

.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px 10px;margin-bottom:10px;}
.fgrid .full{grid-column:1/-1;}
.field-label{font-size:10px;font-weight:800;color:var(--ink3);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px;display:block;}
.field-label .hint{text-transform:none;letter-spacing:0;font-weight:600;color:var(--muted);}
.field-input,.field-select,.field-textarea{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;color:var(--ink);font-family:'Nunito',sans-serif;font-size:13px;font-weight:600;padding:8px 10px;outline:none;transition:border-color 0.2s;}
.field-input:focus,.field-select:focus,.field-textarea:focus{border-color:var(--green2);background:#fff;}
.field-textarea{resize:vertical;min-height:62px;line-height:1.5;}
.sub-head{font-size:10px;font-weight:900;color:var(--green);letter-spacing:0.14em;text-transform:uppercase;padding:8px 0 4px;border-bottom:1.5px solid var(--green-mid);margin:4px 0 8px;}
.note{font-size:11px;color:var(--ink3);background:var(--surface);border:1px dashed var(--border2);border-radius:8px;padding:7px 9px;margin-bottom:9px;line-height:1.5;}

.chips{display:flex;flex-wrap:wrap;gap:5px;}
.chip{background:var(--surface);border:1.5px solid var(--border);border-radius:7px;padding:5px 9px;font-size:11px;font-weight:700;color:var(--ink2);cursor:pointer;user-select:none;}
.chip.sel{background:var(--green-light);border-color:var(--green2);color:var(--green);}
.chips.vert{flex-direction:column;}
.chips.vert .chip{text-align:left;}

.table-wrap{overflow-x:auto;margin-bottom:8px;-webkit-overflow-scrolling:touch;}
.assess-table{width:100%;border-collapse:collapse;font-size:12px;}
.assess-table th{background:var(--green-light);color:var(--ink2);font-size:10px;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;padding:6px 7px;border:1px solid var(--border);text-align:left;white-space:nowrap;}
.assess-table td{border:1px solid var(--border);padding:4px 5px;vertical-align:middle;}
.assess-table tr:nth-child(even) td{background:var(--surface);}
.assess-table .row-label{font-weight:700;color:var(--ink2);font-size:11px;min-width:130px;}
.row-sub{display:block;font-size:10px;color:var(--muted);font-weight:600;}
.row-how{display:block;font-size:10px;color:var(--ink3);font-weight:600;font-style:italic;margin-top:2px;max-width:320px;}
.assess-table input,.assess-table select{width:100%;min-width:62px;border:none;background:transparent;font-family:'Nunito',sans-serif;font-size:12px;font-weight:600;color:var(--ink);outline:none;padding:3px;border-bottom:1.5px solid var(--border2);}
.assess-table input:focus,.assess-table select:focus{border-bottom-color:var(--green2);background:var(--green-light);}
.assess-table .grp td{background:var(--green-mid)!important;font-size:10px;font-weight:900;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink2);}

.pn{display:flex;gap:4px;min-width:130px;}
.pn-btn{flex:1;padding:6px 3px;border:1.5px solid var(--border);border-radius:6px;font-size:10px;font-weight:800;cursor:pointer;background:var(--surface);color:var(--ink3);}
.pn-btn.on[data-v=pos],.pn-btn.on[data-v=yes]{background:var(--red-light);border-color:var(--red);color:var(--red);}
.pn-btn.on[data-v=neg],.pn-btn.on[data-v=no]{background:var(--green-light);border-color:var(--green2);color:var(--green);}
.pn-btn.on[data-v=na]{border-color:var(--muted);color:var(--ink2);background:#eee;}

.nprs-row{display:grid;grid-template-columns:130px 1fr 44px;align-items:center;gap:9px;margin-bottom:8px;}
.nprs-row input{width:100%;accent-color:var(--green);}
.nprs-val{font-size:15px;font-weight:900;color:var(--green);text-align:center;background:var(--green-light);border-radius:6px;padding:3px 0;}

.q-item{border:1px solid var(--border);border-radius:9px;padding:8px 9px;margin-bottom:7px;}
.q-title{font-size:12px;font-weight:800;color:var(--ink2);margin-bottom:6px;}
.calc{background:var(--blue-light);border:1.5px solid rgba(37,99,168,0.25);color:var(--ink);border-radius:9px;padding:9px 11px;margin:4px 0 10px;font-size:12px;font-weight:700;line-height:1.55;}
.calc b{color:var(--blue);}
.calc.warn{background:var(--amber-light);border-color:rgba(212,130,10,0.4);}
.calc.alert{background:var(--red-light);border-color:rgba(192,57,43,0.4);}
.calc.alert b{color:var(--red);}

.img-upload-area{border:2px dashed var(--border2);border-radius:10px;padding:14px;text-align:center;cursor:pointer;background:var(--surface);margin-bottom:7px;}
.img-upload-area:hover{border-color:var(--green2);background:var(--green-light);}
.img-upload-text{font-size:12px;font-weight:700;color:var(--ink3);}
.img-previews{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px;}
.img-thumb{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:2px solid var(--border);}
.img-thumb img{width:100%;height:100%;object-fit:cover;}
.img-thumb button{position:absolute;top:2px;right:2px;background:var(--red);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer;}

.action-row{display:flex;gap:8px;padding:0 12px 14px;position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding-top:14px;}
.btn-main{flex:1;padding:12px;border:none;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;}
.btn-main:active{transform:scale(0.97);}
.btn-save{background:linear-gradient(135deg,#5a7a20,#7fa832);color:#fff;box-shadow:0 3px 10px rgba(107,140,42,0.3);}
.btn-print{background:var(--white);color:var(--ink2);border:1.5px solid var(--border2);}
.btn-clear{background:var(--red-light);color:var(--red);border:1.5px solid rgba(192,57,43,0.3);}

/* RECORDS */
.rec-page-header{padding:12px 12px 8px;}
.rec-search-row{display:flex;gap:7px;margin-bottom:8px;}
.rec-search{flex:1;min-width:0;background:var(--white);border:1.5px solid var(--border);border-radius:9px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:600;padding:9px 12px;outline:none;color:var(--ink);}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px;}
.stat-mini{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:10px 11px;box-shadow:var(--shadow);}
.sm-val{font-size:22px;font-weight:900;color:var(--green);}
.sm-lbl{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:0.07em;text-transform:uppercase;}
.rec-export-row{padding:0 12px 8px;display:flex;gap:7px;flex-wrap:wrap;}
.rec-export-btn{flex:1;min-width:110px;padding:10px;border:1.5px solid var(--border2);border-radius:9px;background:var(--white);font-size:12px;font-weight:800;color:var(--ink2);cursor:pointer;}
.rec-list{padding:0 12px 14px;}
.rec-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:9px;box-shadow:var(--shadow);}
.rec-name{font-size:15px;font-weight:900;color:var(--ink);}
.rec-date{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px;}
.rec-tags{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0;}
.rec-tag{font-size:10px;font-weight:700;background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:2px 7px;color:var(--ink3);}
.rec-tag.red{color:var(--red);border-color:rgba(192,57,43,0.25);}
.rec-tag.blue{color:var(--blue);}
.rec-actions{display:flex;gap:6px;flex-wrap:wrap;}
.rec-btn{flex:1;min-width:70px;padding:8px;border-radius:7px;font-size:11px;font-weight:800;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--ink2);}
.rec-btn.view{background:var(--green-light);color:var(--green);border-color:var(--green-mid);}
.rec-btn.del{background:var(--red-light);color:var(--red);border-color:rgba(192,57,43,0.2);}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted);font-size:13px;line-height:1.6;}
.empty-state h3{font-size:16px;font-weight:800;color:var(--ink2);margin:10px 0 6px;}

/* REPORT MODAL */
.modal-overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.6);overflow-y:auto;}
.modal-overlay.open{display:block;}
.modal-box{background:var(--white);border-radius:16px 16px 0 0;margin:24px auto 0;max-width:980px;min-height:calc(100dvh - 24px);}
.modal-head{position:sticky;top:0;background:linear-gradient(135deg,#2d4a0e,#5a7a20);padding:12px 14px;border-radius:16px 16px 0 0;display:flex;align-items:center;gap:8px;z-index:10;}
.modal-head-title{flex:1;font-size:14px;font-weight:900;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.modal-btn{background:rgba(255,255,255,0.2);border:none;border-radius:7px;padding:6px 11px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;}
.modal-body{padding:14px;}
.rep-banner{background:var(--green-light);border-radius:10px;padding:12px 13px;margin-bottom:12px;border:1px solid var(--green-mid);}
.rep-banner .t{font-family:'Crimson Pro',serif;font-size:19px;font-weight:600;}
.rep-banner .s{font-size:12px;color:var(--ink3);}
.rep-sec{margin-bottom:12px;border:1px solid var(--border);border-radius:10px;overflow:hidden;break-inside:avoid-page;}
.rep-sec-head{background:var(--green-light);padding:7px 12px;font-size:11px;font-weight:900;color:var(--ink2);border-bottom:1px solid var(--border);letter-spacing:0.08em;text-transform:uppercase;}
.rep-sec-body{padding:9px 12px;font-size:12.5px;line-height:1.6;color:var(--ink2);}
.rep-sub{font-size:10px;font-weight:900;color:var(--green);letter-spacing:0.12em;text-transform:uppercase;margin:8px 0 4px;}
.rep-kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 14px;}
.rep-kv div{padding:2px 0;border-bottom:1px dotted var(--border);}
.rep-kv .full{grid-column:1/-1;white-space:pre-wrap;}
.rep-kv b{color:var(--ink);font-weight:800;}
.rep-table{width:100%;border-collapse:collapse;font-size:11.5px;margin:3px 0 6px;}
.rep-table th{background:var(--surface);font-size:10px;text-transform:uppercase;letter-spacing:0.04em;text-align:left;padding:4px 6px;border:1px solid var(--border);}
.rep-table td{padding:4px 6px;border:1px solid var(--border);}
.tag{display:inline-block;border-radius:5px;padding:2px 8px;font-size:11.5px;font-weight:700;margin:2px 3px 2px 0;}
.tag.pos{background:var(--red-light);color:var(--red);border:1px solid rgba(192,57,43,0.2);}
.tag.ok{background:var(--green-light);color:var(--green);border:1px solid var(--green-mid);}
.tag.info{background:var(--blue-light);color:var(--blue);}
.rep-imgs{display:flex;flex-wrap:wrap;gap:8px;}
.rep-imgs img{height:150px;border-radius:8px;border:1px solid var(--border);}
.rep-foot{text-align:center;padding:14px 0 4px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:0.07em;}
.sign-line{display:flex;justify-content:space-between;gap:20px;margin-top:26px;font-size:11px;color:var(--ink3);}
.sign-line div{flex:1;border-top:1px solid var(--ink3);padding-top:4px;text-align:center;}

.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:11px 20px;border-radius:28px;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}

@media (max-width:520px){
  .nprs-row{grid-template-columns:96px 1fr 40px;}
  .fgrid{grid-template-columns:1fr 1fr;}
  .nav-link{font-size:10px;padding:5px 8px;}
}
@media print{
  body{background:#fff;padding:0;}
  body.printing>*:not(#view-modal){display:none!important;}
  #view-modal{position:static;background:none;display:block!important;overflow:visible;}
  .modal-box{margin:0;border-radius:0;min-height:0;max-width:none;}
  .modal-head{display:none!important;}
  .modal-body{padding:0;}
  .rep-sec{border-color:#bbb;}
  @page{margin:12mm;}
}

.region-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:7px;margin-bottom:12px;}
.region-btn{background:var(--white);border:2px solid var(--border);border-radius:11px;padding:9px 4px;text-align:center;cursor:pointer;}
.region-btn:active{transform:scale(0.96);}
.region-btn.active{background:var(--green-light);border-color:var(--green2);}
.region-icon{font-size:20px;display:block;margin-bottom:3px;}
.region-label{font-size:10.5px;font-weight:800;color:var(--ink2);}
.region-btn.active .region-label{color:var(--green);}
.rec-filter{background:var(--white);border:1.5px solid var(--border);border-radius:9px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;padding:9px 8px;outline:none;color:var(--ink2);max-width:40%;}
.rec-region{font-size:10px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:var(--green-light);color:var(--green);border:1px solid var(--green-mid);flex-shrink:0;}
.dim{color:var(--ink3);font-weight:600;}
.rep-grp{background:var(--green-light);font-weight:900;font-size:10px;letter-spacing:.08em;text-transform:uppercase;}
@media print{ body.printing .toast{display:none!important;} }
.confirm-dlg{display:none;position:fixed;inset:0;z-index:900;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;padding:16px;}
.confirm-dlg.open{display:flex;}
.confirm-box{background:var(--white);border-radius:14px;padding:18px 16px 14px;max-width:380px;width:100%;font-size:14px;font-weight:700;color:var(--ink);line-height:1.5;box-shadow:0 8px 30px rgba(0,0,0,0.25);}
.confirm-actions{display:flex;gap:8px;margin-top:16px;}

</style>
</head>
<body>
<div class="nav-bar">
  <div class="wrap">
    <div class="nav-top">
      <div style="width:38px;height:38px;background:rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">🦴</div>
      <div><div class="brand-name">Joint Space</div><div class="brand-sub">Physiotherapy Assessment Proforma</div></div>
    </div>
    <div class="nav-tabs">
      <button class="nav-tab active" data-page="form">📋 Assessment</button>
      <button class="nav-tab" data-page="records">📂 Saved Records <span class="tab-badge" id="rec-badge">0</span></button>
    </div>
  </div>
</div>

<div class="page active" id="page-form">
  <div class="wrap">
    <div class="form-wrap">
      <div class="field-label" style="margin-bottom:7px">Select joint / region</div>
      <div class="region-grid" id="region-grid"></div>
      <div class="form-head">
        <div class="form-head-title" id="region-title">Assessment</div>
        <div class="form-head-sub">Subjective · flags · outcome measures · ROM · MMT · neuro · special tests · palpation · MRI &amp; imaging · diagnosis · plan</div>
        <span class="edit-flag" id="edit-flag"></span>
      </div>
      <div class="sec-nav" id="sec-nav"></div>
      <div class="tools-row">
        <button id="btn-expand">⤢ Expand all</button>
        <button id="btn-collapse">⤡ Collapse all</button>
        <button id="btn-new">＋ New patient</button>
      </div>
      <div id="assessment-form"></div>
    </div>
    <div class="action-row">
      <button class="btn-main btn-save" id="btn-save">💾 Save</button>
      <button class="btn-main btn-print" id="btn-report">📄 Report / Print</button>
      <button class="btn-main btn-clear" id="btn-clear">↺ Clear</button>
    </div>
  </div>
</div>

<div class="page" id="page-records">
  <div class="wrap">
    <div class="rec-page-header">
      <div class="rec-search-row">
        <input class="rec-search" type="text" id="rec-search" placeholder="🔍 Search name, case no, diagnosis…">
        <select class="rec-filter" id="rec-region"></select>
      </div>
      <div class="stats-row" id="rec-stats"></div>
    </div>
    <div class="rec-export-row">
      <button class="rec-export-btn" id="btn-csv">📥 Export CSV</button>
      <button class="rec-export-btn" id="btn-json" style="color:var(--blue)">💾 Backup (JSON)</button>
      <button class="rec-export-btn" id="btn-import" style="color:var(--amber)">📤 Restore</button>
    </div>
    <input type="file" id="import-file" accept=".json" style="display:none">
    <div class="rec-list" id="records-list"></div>
  </div>
</div>

<div class="modal-overlay" id="view-modal">
  <div class="modal-box">
    <div class="modal-head">

const QDEF = {

    ['3. Lifting',['I can lift heavy weights without extra pain','I can lift heavy weights but it gives extra pain','Pain prevents lifting heavy weights off the floor, but I manage if conveniently placed (e.g. on a table)','Pain prevents lifting heavy weights, but I manage light–medium weights if conveniently positioned','I can lift very light weights','I cannot lift or carry anything at all']],

    ['5. Sitting',['I can sit in any chair as long as I like','I can only sit in my favourite chair as long as I like','Pain prevents me sitting more than 1 hour','Pain prevents me sitting more than 30 minutes','Pain prevents me sitting more than 10 minutes','Pain prevents me from sitting at all']],
    ['6. Standing',['I can stand as long as I want without extra pain','I can stand as long as I want but it gives extra pain','Pain prevents me standing for more than 1 hour','Pain prevents me standing for more than 30 minutes','Pain prevents me standing for more than 10 minutes','Pain prevents me from standing at all']],
    ['7. Sleeping',['My sleep is never disturbed by pain','My sleep is occasionally disturbed by pain','Because of pain I have less than 6 hours sleep','Because of pain I have less than 4 hours sleep','Because of pain I have less than 2 hours sleep','Pain prevents me from sleeping at all']],
    ['8. Sex life (if applicable)',['My sex life is normal and causes no extra pain','My sex life is normal but causes some extra pain','My sex life is nearly normal but is very painful','My sex life is severely restricted by pain','My sex life is nearly absent because of pain','Pain prevents any sex life at all']],
    ['9. Social life',['My social life is normal and gives me no extra pain','My social life is normal but increases the degree of pain','Pain has no significant effect apart from limiting energetic interests (e.g. sport)','Pain has restricted my social life and I do not go out as often','Pain has restricted my social life to my home','I have no social life because of pain']],

    return {val:pct, txt:`ODI: <b>${pct}%</b> — ${band} <span class="dim">(${x.length}/10 answered; MCID ≈ 10 points)</span>`, lvl:pct>40?'warn':''}; }},
  sb:{t:'Keele STarT Back Screening Tool', short:'STarT Back', items:[

  ],

  ndi:{t:'Neck Disability Index (NDI)', short:'NDI', showIdx:1, items:[

    ['9. Sleeping',['I have no trouble sleeping','My sleep is slightly disturbed (< 1 h sleepless)','My sleep is mildly disturbed (1–2 h sleepless)','My sleep is moderately disturbed (2–3 h sleepless)','My sleep is greatly disturbed (3–5 h sleepless)','My sleep is completely disturbed (5–7 h sleepless)']],

  score(a){ const x=a.filter(n=>n!==null); if(!x.length) return null; const pct=Math.round(x.reduce((p,c)=>p+c,0)/(x.length*5)*100);

  spadi:{t:'Shoulder Pain and Disability Index (SPADI) — 0 = none, 10 = worst', short:'SPADI', items:[
    ...['At its worst?','When lying on the involved side?','Reaching for something on a high shelf?','Touching the back of your neck?','Pushing with the involved arm?'].map((q,i)=>[`Pain ${i+1}. ${q}`,[...Array(11).keys()].map(String)]),

  ], row:1,

// HELPERS
// ═════════════════════════════════════════════════════════════════
const $ = s => document.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const has = v => Array.isArray(v) ? v.length > 0 : v !== undefined && v !== null && String(v).trim() !== '';
const num = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };
const today = () => new Date().toISOString().slice(0,10);
const isRow = r => Array.isArray(r);
function showToast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400); }
function eachBlock(secs, fn) { secs.forEach(s => s.b.forEach(b => fn(b, s))); }
function listRows(secs, k) { let out = []; eachBlock(secs, b => { if (b.tests?.k===k) out = b.tests.rows.filter(isRow); if (b.tbl?.k===k) out = b.tbl.rows.filter(isRow); }); return out; }
function rowIdx(secs, k, prefix) { return listRows(secs, k).findIndex(r => r[0].startsWith(prefix)); }
function stPosSides(v, secs, prefix) { const i = rowIdx(secs, 'st', prefix); return i < 0 ? [] : ['L','R','C'].filter(s => v[`st.${i}.${s}`]==='pos'); }
function stTested(v, secs, prefix) { const i = rowIdx(secs, 'st', prefix); return i >= 0 && ['L','R','C'].some(s => has(v[`st.${i}.${s}`])); }
const pct = (a, b) => b ? Math.round(a / b * 100) : null;

// ═════════════════════════════════════════════════════════════════
// FORM RENDERING
// ═════════════════════════════════════════════════════════════════
function ctl(key, c, cls='', rowOpts) {
  const t = c.t || 'text';
  if (t === 'sel') { const o = (c.rowOpts && rowOpts) || c.o; return `<select data-k="${key}" class="${cls}"><option value="">—</option>${o.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`; }
  if (t === 'ta') return `<textarea data-k="${key}" class="${cls}" placeholder="${esc(c.ph||'')}"></textarea>`;
  if (t === 'chip' || t === 'multi') return `<div class="chips" data-k="${key}"${t==='multi'?' data-multi="1"':''}>${c.o.map(o=>`<span class="chip" data-v="${esc(o)}">${esc(o)}</span>`).join('')}</div>`;
  const it = t === 'num' ? 'number' : t === 'date' ? 'date' : 'text';
  return `<input type="${it}" data-k="${key}" class="${cls}" placeholder="${esc(c.ph||'')}"${it==='number'?' step="any" inputmode="decimal"':''}>`;
}
function fieldHTML(f) {
  const cls = f.t==='sel' ? 'field-select' : f.t==='ta' ? 'field-textarea' : 'field-input';
  const full = f.full || f.t==='ta' || f.t==='multi';
  return `<div class="${full?'full':''}"><label class="field-label">${esc(f.l)}${f.u?` <span class="hint">(${esc(f.u)})</span>`:''}</label>${ctl(f.k,f,cls)}</div>`;
}
function pnHTML(key, yn) {
  const opts = yn ? [['yes','YES'],['no','NO']] : [['pos','POS'],['neg','NEG'],['na','N/A']];
  return `<div class="pn" data-k="${key}">${opts.map(([v,l])=>`<button type="button" class="pn-btn" data-v="${v}">${l}</button>`).join('')}</div>`;
}
function tableHTML(tb) {
  let ri = 0;
  const body = tb.rows.map(r => {
    if (!isRow(r)) return `<tr class="grp"><td colspan="${tb.cols.length+1}">${esc(r.g)}</td></tr>`;
    const i = ri++;
    return `<tr><td class="row-label">${esc(r[0])}${r[1]?`<span class="row-sub">${esc(r[1])}</span>`:''}</td>${tb.cols.map((c,ci)=>`<td>${ctl(`${tb.k}.${i}.${ci}`,c,'',r[2])}</td>`).join('')}</tr>`;
  }).join('');
  return `<div class="table-wrap"><table class="assess-table"><thead><tr><th>Item</th>${tb.cols.map(c=>`<th>${esc(c.h)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function testsHTML(ts) {
  let ri = 0;
  const cols = ts.yn ? 2 : 4;
  const body = ts.rows.map(r => {
    if (!isRow(r)) return `<tr class="grp"><td colspan="${cols}">${esc(r.g)}</td></tr>`;
    const i = ri++, [name, purpose, sides, how] = r;
    const lbl = `<td class="row-label">${ts.yn&&sides===1?'⚠ ':''}${esc(name)}<span class="row-sub">${esc(purpose)}</span>${how?`<span class="row-how">${esc(how)}</span>`:''}</td>`;
    if (ts.yn) return `<tr>${lbl}<td>${pnHTML(`${ts.k}.${i}`,1)}</td></tr>`;
    const cells = sides === 2 ? `<td>${pnHTML(`${ts.k}.${i}.L`)}</td><td>${pnHTML(`${ts.k}.${i}.R`)}</td>` : `<td colspan="2">${pnHTML(`${ts.k}.${i}.C`)}</td>`;
    return `<tr>${lbl}${cells}<td><input type="text" data-k="${ts.k}.${i}.f" placeholder="Findings…"></td></tr>`;
  }).join('');
  const head = ts.yn ? '<th>Item</th><th>Present?</th>' : '<th>Test &amp; purpose</th><th>Left</th><th>Right</th><th>Findings</th>';
  return `<div class="table-wrap"><table class="assess-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function qHTML(id) {
  const Q = QDEF[id];
  return `<div class="sub-head">${esc(Q.t)}</div>` + Q.items.map(([title, opts], i) => {
    const vert = !Q.row && opts.length > 2;
    return `<div class="q-item"><div class="q-title">${esc(title)}</div><div class="chips ${vert?'vert':''}" data-k="${id}.${i}">${opts.map((o,oi)=>{const lab=Array.isArray(o)?`${o[0]} (${o[1]})`:(Q.showIdx?oi+' — ':'')+o;return `<span class="chip" data-v="${oi}">${esc(lab)}</span>`;}).join('')}</div></div>`;
  }).join('') + `<div class="calc" data-calc="q:${id}"></div>`;
}
function blockHTML(b) {
  if (b.h) return `<div class="sub-head">${esc(b.h)}</div>`;

function sideCmp(label, l, r, invSide, higherBetter=true, unit='') {

  else if (higherBetter) { inv = Math.min(l,r); un = Math.max(l,r); } else { inv = Math.max(l,r); un = Math.min(l,r); }
  const lsi = Math.round((higherBetter ? inv/un : un/inv) * 100);
  return `${esc(label)} L <b>${l}${unit}</b> / R <b>${r}${unit}</b> → LSI <b>${lsi}%</b>${lsi<90?' ⚠ (< 90%)':''}`;
}

function runCalc(name, v, ctx) {

// STORAGE — IndexedDB (records) + localStorage (draft)
// ═════════════════════════════════════════════════════════════════
let db = null, RECORDS = [], currentId = null;
const DRAFT_KEY = 'jointspace_proforma_draft';
function initDB() {
  return new Promise(res => {
    try {
      const rq = indexedDB.open('JointSpaceProformaDB', 1);
      rq.onupgradeneeded = e => { const d = e.target.result; if (!d.objectStoreNames.contains('records')) d.createObjectStore('records', { keyPath:'id' }); };
      rq.onsuccess = e => { db = e.target.result; const tx = db.transaction('records','readonly').objectStore('records').getAll(); tx.onsuccess = () => { RECORDS = tx.result || []; res(); }; tx.onerror = () => res(); };
      rq.onerror = () => res();
    } catch (e) { res(); }
  });
}
function dbPut(rec) { return new Promise(res => { const i = RECORDS.findIndex(r => r.id === rec.id); if (i >= 0) RECORDS[i] = rec; else RECORDS.push(rec); if (!db) return res();
  try { const tx = db.transaction('records','readwrite'); tx.objectStore('records').put(rec); tx.oncomplete = res; tx.onerror = res; } catch (e) { res(); } }); }
function dbDel(id) { return new Promise(res => { RECORDS = RECORDS.filter(r => r.id !== id); if (!db) return res();
  try { const tx = db.transaction('records','readwrite'); tx.objectStore('records').delete(id); tx.oncomplete = res; tx.onerror = res; } catch (e) { res(); } }); }
let draftTimer;
function saveDraft() { clearTimeout(draftTimer); draftTimer = setTimeout(() => { try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ region:REGION, v:getVals(), images:IMAGES, id:currentId })); } catch (e) {} }, 500); }
function loadDraft() { try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) { return null; } }
function clearDraft() { clearTimeout(draftTimer); try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }
function updateBadge() { const b = $('#rec-badge'); b.textContent = RECORDS.length; b.classList.toggle('show', RECORDS.length > 0); }
function setEditing(id) { currentId = id; const f = $('#edit-flag'); const r = RECORDS.find(x => x.id === id);
  f.textContent = r ? `✎ Editing saved record — ${r.v['pt.name']||'Unnamed'}` : ''; f.classList.toggle('show', !!r); }
function loadInto(rid, v, images, id) {
  buildForm(rid); setVals(v || {});
  IMAGES = { mri:[], posture:[], other:[], ...(images ? JSON.parse(JSON.stringify(images)) : {}) };
  renderImages(); setEditing(id ?? null); recompute();
}
function newForm(rid, carry) {
  loadInto(rid, { 'pt.date':today(), 'sign.date':today(), ...(carry||{}) }, null, null);
  clearDraft(); $('#sec-pt').classList.add('open'); window.scrollTo({ top:0 });
}
function hasClinicalData(v) { return Object.keys(v).some(k => !k.startsWith('pt.') && !k.startsWith('pmh.') && k!=='sign.date'); }
function carryOver(v) { const c = {}; Object.keys(v).filter(k=>k.startsWith('pt.')||k.startsWith('pmh.')).forEach(k=>c[k]=v[k]); return c; }
// In-app confirm dialog (window.confirm is blocked in many app wrappers / WebViews)
function askConfirm(msg, okLabel='OK') {

    const d = $('#confirm-dlg'); $('#confirm-msg').textContent = msg; $('#confirm-ok').textContent = okLabel; d.classList.add('open');
    const done = val => { d.classList.remove('open'); $('#confirm-ok').onclick = $('#confirm-cancel').onclick = null; res(val); };
    $('#confirm-ok').onclick = () => done(true); $('#confirm-cancel').onclick = () => done(false);

async function switchRegion(rid) {

  newForm(rid, carryOver(v)); showToast(`${REGIONS[rid].icon} ${REGIONS[rid].label}`);
}
async function saveAssessment() {
  const v = recompute();
  if (!has(v['pt.name'])) { showToast('⚠️ Enter patient name first'); openSection('pt'); return; }
  const old = RECORDS.find(r => r.id === currentId);
  const rec = { id: currentId || Date.now(), region: REGION, createdAt: old?.createdAt || new Date().toISOString(), savedAt: new Date().toISOString(), v, images: IMAGES };
  await dbPut(rec); setEditing(rec.id); clearDraft(); updateBadge();
  showToast('✅ Saved — ' + v['pt.name']);
}

// REPORT — line-by-line detail of every recorded item
// ═════════════════════════════════════════════════════════════════
const fmt = val => Array.isArray(val) ? val.join(', ') : val;
const PN_TXT = { pos:'POS', neg:'NEG', na:'N/A', yes:'YES', no:'NO' };
const pnTag = x => x ? `<span class="tag ${x==='pos'||x==='yes'?'pos':x==='neg'||x==='no'?'ok':'info'}">${PN_TXT[x]}</span>` : '—';
function calcBox(r) { return r ? `<div class="calc ${r.lvl||''}" style="margin:6px 0">${r.html}</div>` : ''; }
function repBlock(b, v, rec, ctx) {
  if (b.f) { const items = b.f.filter(f => has(v[f.k])); if (!items.length) return '';
    return `<div class="rep-kv">${items.map(f=>`<div class="${f.t==='ta'||f.full?'full':''}"><b>${esc(f.l.replace(' *',''))}:</b> ${esc(fmt(v[f.k]))}${f.u&&!Array.isArray(v[f.k])?' '+esc(f.u):''}</div>`).join('')}</div>`; }
  if (b.tbl) { const tb = b.tbl; let ri = 0; const rows = [];
    tb.rows.forEach(r => { if (!isRow(r)) return; const i = ri++; const cells = tb.cols.map((c,ci)=>v[`${tb.k}.${i}.${ci}`]);
      if (cells.some(has)) rows.push(`<tr><td><b>${esc(r[0])}</b>${r[1]?`<br><span class="dim" style="font-size:10px">${esc(r[1])}</span>`:''}</td>${cells.map(x=>`<td>${has(x)?esc(x):'—'}</td>`).join('')}</tr>`); });
    return rows.length ? `<div style="overflow-x:auto"><table class="rep-table"><thead><tr><th>Item</th>${tb.cols.map(c=>`<th>${esc(c.h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>` : ''; }
  if (b.tests) { const ts = b.tests; let ri = 0, grp = null; const rows = [];
    ts.rows.forEach(r => { if (!isRow(r)) { grp = r.g; return; } const i = ri++;
      if (ts.yn) { const x = v[`${ts.k}.${i}`]; if (has(x)) rows.push({grp, html:`<tr><td>${esc(r[0])}<br><span class="dim" style="font-size:10px">${esc(r[1])}</span></td><td>${pnTag(x)}</td></tr>`}); return; }
      const L=v[`${ts.k}.${i}.L`], Rr=v[`${ts.k}.${i}.R`], C=v[`${ts.k}.${i}.C`], F=v[`${ts.k}.${i}.f`];
      if ([L,Rr,C,F].some(has)) rows.push({grp, html:`<tr><td><b>${esc(r[0])}</b><br><span class="dim" style="font-size:10px">${esc(r[1])}</span></td>${r[2]===2?`<td>${pnTag(L)}</td><td>${pnTag(Rr)}</td>`:`<td colspan="2" style="text-align:center">${pnTag(C)}</td>`}<td>${esc(F||'')}</td></tr>`}); });
    if (!rows.length) return ''; let last = null; const cols = ts.yn ? 2 : 4;
    const body = rows.map(x => { const g = x.grp && x.grp!==last ? `<tr><td colspan="${cols}" class="rep-grp">${esc(x.grp)}</td></tr>` : ''; last = x.grp; return g + x.html; }).join('');
    return `<table class="rep-table"><thead><tr>${ts.yn?'<th>Item</th><th>Present</th>':'<th>Test</th><th>Left</th><th>Right</th><th>Findings</th>'}</tr></thead><tbody>${body}</tbody></table>`; }
  if (b.nprs) { const items = b.nprs.filter(([k])=>has(v[k])); return items.length ? `<div>${items.map(([k,l])=>{const n=+v[k];return `<span class="tag ${n>=7?'pos':n>=4?'info':'ok'}">${esc(l)}: ${n}/10</span>`;}).join('')}</div>` : ''; }
  if (b.q) { const Q = QDEF[b.q]; const ans = Q.items.map(([t,o],i)=>{const x=v[`${b.q}.${i}`]; if(!has(x)) return ''; const opt=o[+x]; return `<tr><td>${esc(t)}</td><td>${esc(Array.isArray(opt)?opt[0]:opt)} <b>(${Array.isArray(opt)?opt[1]:x})</b></td></tr>`;}).join('');
    return ans ? `<div class="rep-sub">${esc(Q.t)}</div><table class="rep-table"><tbody>${ans}</tbody></table>${calcBox(runCalc('q:'+b.q, v, ctx))}` : ''; }
  if (b.cl) return b.cl.map(c => has(v[c.k]) ? `<div class="rep-kv"><div class="full"><b>${esc(c.l)}:</b> ${esc(fmt(v[c.k]))}</div></div>${calcBox(runCalc('cl:'+c.k, v, ctx))}` : '').join('');
  if (b.calc) return calcBox(runCalc(b.calc, v, ctx));
  if (b.img) { const im = (rec.images||{})[b.img]||[]; return im.length ? `<div class="rep-imgs">${im.map(src=>`<img src="${src}" alt="">`).join('')}</div>` : ''; }
  return '';
}
function positiveTests(v, secs) { return listRows(secs,'st').map((r,i)=>{ const s=['L','R','C'].filter(x=>v[`st.${i}.${x}`]==='pos'); return s.length ? r[0]+(s[0]!=='C'?' ('+s.join('/')+')':'') : null; }).filter(Boolean); }
function keySummary(v, ctx) {
  const {secs, R} = ctx, out = [];
  const rf = listRows(secs,'rf').filter((r,i)=>v['rf.'+i]==='yes');
  if (rf.length) out.push(`<div><b style="color:var(--red)">Red flags:</b> ${rf.map(r=>`<span class="tag pos">${esc(r[0])}</span>`).join('')}</div>`);
  const pos = positiveTests(v, secs);
  if (pos.length) out.push(`<div><b>Positive special tests (${pos.length}):</b> ${pos.map(p=>`<span class="tag pos">${esc(p)}</span>`).join('')}</div>`);
  const weak = [];
  eachBlock(secs, b => { if (!b.tbl?.mmt) return; b.tbl.rows.filter(isRow).forEach((r,i)=>[['L',0],['R',1]].forEach(([s,c])=>{ const g=v[`${b.tbl.k}.${i}.${c}`]; if (g && g!=='5' && g!=='NT') weak.push(`${r[0].split(' — ')[0]} ${s} ${g}/5`); })); });
  if (weak.length) out.push(`<div><b>Weakness:</b> ${weak.map(w=>`<span class="tag info">${esc(w)}</span>`).join('')}</div>`);
  const neuro = [];
  listRows(secs,'derm').forEach((r,i)=>[0,1,2,3].forEach(c=>{ const x=v[`derm.${i}.${c}`]; if (x && x!=='Normal') neuro.push(`${r[0]} ${['L LT','R LT','L PP','R PP'][c]}: ${x}`); }));
  listRows(secs,'pns').forEach((r,i)=>[0,1].forEach(c=>{ const x=v[`pns.${i}.${c}`]; if (x && x!=='Normal') neuro.push(`${r[0]} ${c?'R':'L'}: ${x}`); }));
  listRows(secs,'refl').forEach((r,i)=>[0,1].forEach(c=>{ const x=v[`refl.${i}.${c}`]; if (x && !x.startsWith('2+')) neuro.push(`${r[0]} ${c?'R':'L'}: ${x}`); }));
  listRows(secs,'umn').forEach((r,i)=>[0,1].forEach(c=>{ if (v[`umn.${i}.${c}`]==='Positive') neuro.push(`${r[0]} ${c?'R':'L'} +`); }));
  if (neuro.length) out.push(`<div><b>Neuro findings:</b> ${neuro.map(w=>`<span class="tag pos">${esc(w)}</span>`).join('')}</div>`);
  const names = [];
  eachBlock(secs, b => { if (b.q) names.push('q:'+b.q); if (b.cl) b.cl.forEach(c=>names.push('cl:'+c.k)); });
  ['clusters','bmi',...(R.summary||[])].forEach(n=>names.push(n));
  names.forEach(n => { const r = runCalc(n, v, ctx); if (r) out.push(calcBox(r)); });
  return out.join('');
}
function buildReport(rec) {
  const v = rec.v || {}, rid = rec.region || 'lumbar', R = REGIONS[rid], secs = buildSections(rid), ctx = {secs, R};
  const date = v['pt.date'] ? new Date(v['pt.date']).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'}) : '';
  let html = `<div class="rep-banner"><div class="t">Joint Space Physiotherapy</div>
    <div class="s">${esc(R.label)} Assessment Proforma${date?' · '+esc(date):''}</div>
    <div style="margin-top:6px;font-size:13px"><b>${esc(v['pt.name']||'Patient')}</b>${v['pt.age']?' · '+esc(v['pt.age'])+' yrs':''}${v['pt.sex']?' · '+esc(v['pt.sex']):''}${v['pt.side']?' · '+esc(v['pt.side'])+' side':''}${v['pt.case']?' · Case '+esc(v['pt.case']):''}</div>
    ${v['dx.primary']?`<div style="margin-top:4px;font-size:12.5px;color:var(--blue);font-weight:800">Dx: ${esc(v['dx.primary'])}${v['dx.level']?.length?' — '+esc(v['dx.level'].join(', ')):''}${v['dx.side']?' ('+esc(v['dx.side'])+')':''}${v['dx.grade']?' · '+esc(v['dx.grade']):''}</div>`:''}</div>`;
  const ks = keySummary(v, ctx);
  if (ks) html += `<div class="rep-sec"><div class="rep-sec-head">★ Key findings summary</div><div class="rep-sec-body">${ks}</div></div>`;
  secs.forEach((s, n) => {
    let body = '', pend = '';
    s.b.forEach(b => { if (b.h) { pend = b.h; return; } if (b.note) return; const h = repBlock(b, v, rec, ctx);
      if (h) { if (pend) { body += `<div class="rep-sub">${esc(pend)}</div>`; pend = ''; } body += h; } });
    if (body) html += `<div class="rep-sec"><div class="rep-sec-head">${n+1}. ${esc(s.t)}</div><div class="rep-sec-body">${body}</div></div>`;
  });
  html += `<div class="sign-line"><div>Patient / guardian signature</div><div>${esc(v['sign.by']||'Physiotherapist')}${v['sign.qual']?', '+esc(v['sign.qual']):''}${v['sign.reg']?' · Reg '+esc(v['sign.reg']):''}</div></div>
  <div class="rep-foot">Joint Space Physiotherapy · Confidential Patient Record · Where Science Meets Movement</div>`;
  return html;
}
function openReport(rec) {
  $('#modal-title').textContent = `${rec.v['pt.name'] || 'Patient'} — ${REGIONS[rec.region||'lumbar'].label}`;
  $('#modal-body').innerHTML = buildReport(rec);
  $('#view-modal').classList.add('open'); document.body.style.overflow = 'hidden';
}
function closeReport() { $('#view-modal').classList.remove('open'); document.body.style.overflow = ''; }

function primaryScore(rec) {
  const secs = buildSections(rec.region||'lumbar'); let q = null; eachBlock(secs, b => { if (b.q && !q) q = b.q; });
  if (!q) return null; const r = runCalc('q:'+q, rec.v, {secs}); return r && r.val !== null && r.val !== undefined ? `${QDEF[q].short} ${r.val}${typeof r.val==='number'&&['odi','ndi','spadi'].includes(q)?'%':''}` : null;
}
function renderRecords() {
  const q = ($('#rec-search').value || '').toLowerCase(), rf = $('#rec-region').value;
  const all = RECORDS.slice().sort((a,b)=>new Date(b.savedAt)-new Date(a.savedAt));
  const list = all.filter(r => (!rf || r.region===rf) && (!q || [r.v['pt.name'],r.v['pt.case'],r.v['dx.primary'],fmt(r.v['dx.level']||''),r.v['hx.cc'],r.v['pt.phone'],REGIONS[r.region]?.label].join(' ').toLowerCase().includes(q)));
  const cnt = {}; all.forEach(r => cnt[r.region] = (cnt[r.region]||0)+1);
  const top = Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];

    <div class="stat-mini"><div class="sm-val" style="font-size:15px;line-height:1.3">${top?esc(REGIONS[top[0]]?.short||top[0]):'—'}</div><div class="sm-lbl">Most assessed</div></div>`;
  if (!list.length) { $('#records-list').innerHTML = `<div class="empty-state"><div style="font-size:42px">${all.length?'🔍':'📭'}</div><h3>${all.length?'No matches':'No assessments yet'}</h3>${all.length?'Try another search or region.':'Complete an assessment and tap Save.'}</div>`; return; }
  $('#records-list').innerHTML = list.map(r => {
    const v = r.v, R = REGIONS[r.region] || REGIONS.lumbar, secs = buildSections(r.region||'lumbar');
    const rfc = runCalc('rf', v, {secs, R}), pos = positiveTests(v, secs), ps = primaryScore(r);
    const d = new Date(v['pt.date'] || r.savedAt).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});

        <div class="rec-name">${esc(v['pt.name']||'Unnamed')}</div><div class="rec-date">📅 ${esc(d)}${v['pt.therapist']?' · '+esc(v['pt.therapist']):''}</div></div>

        ${v['pt.side']?`<span class="rec-tag">${esc(v['pt.side'])}</span>`:''}${v['dx.primary']?`<span class="rec-tag blue">${esc(v['dx.primary'])}</span>`:''}${ps?`<span class="rec-tag">${esc(ps)}</span>`:''}
        ${rfc?.lvl==='alert'?`<span class="rec-tag red">🚩 Red flags</span>`:''}
        ${pos.slice(0,4).map(p=>`<span class="rec-tag red">+${esc(p)}</span>`).join('')}${pos.length>4?`<span class="rec-tag red">+${pos.length-4} more</span>`:''}
      </div>
      ${v['hx.cc']?`<div style="font-size:12px;color:var(--ink3);font-style:italic;margin-bottom:8px">"${esc(v['hx.cc'].slice(0,120))}${v['hx.cc'].length>120?'…':''}"</div>`:''}
      <div class="rec-actions">

  }).join('');

function download(name, data, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data],{type})); a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000); }
function exportCSV() {
  if (!RECORDS.length) return showToast('No records to export');
  const hdr = ['Name','Case no','Date','Age','Sex','Region','Side','Occupation','Chief complaint','Duration','NPRS current','NPRS worst','Diagnosis','Structure / level','Primary score','Red flags','Positive special tests','Therapist','Saved at'];
  const rows = RECORDS.map(r => { const v = r.v, secs = buildSections(r.region||'lumbar');
    const rf = listRows(secs,'rf').filter((x,i)=>v['rf.'+i]==='yes').map(x=>x[0]);
    return [v['pt.name'],v['pt.case'],v['pt.date'],v['pt.age'],v['pt.sex'],REGIONS[r.region]?.label,v['pt.side'],v['pt.occ'],v['hx.cc'],v['hx.dur'],v['nprs.now'],v['nprs.worst'],v['dx.primary'],fmt(v['dx.level']||''),primaryScore(r)||'',rf.join(' | '),positiveTests(v,secs).join(' | '),v['sign.by']||v['pt.therapist'],r.savedAt]; });
  const csv = [hdr,...rows].map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""').replace(/\n/g,' ')+'"').join(',')).join('\n');
  download('JointSpace_Assessments_' + today() + '.csv', '﻿' + csv, 'text/csv'); showToast('📥 CSV exported');
}
function exportJSON() { if (!RECORDS.length) return showToast('No records to back up'); download('JointSpace_Backup_' + today() + '.json', JSON.stringify(RECORDS), 'application/json'); showToast('💾 Backup downloaded'); }
async function handleImport(e) {
  const file = e.target.files[0]; if (!file) return;
  try { const recs = JSON.parse(await file.text()); if (!Array.isArray(recs)) throw 0; let n = 0;
    for (const r of recs) if (r && r.id && r.v && typeof r.v === 'object') { if (!REGIONS[r.region]) r.region = 'lumbar'; await dbPut(r); n++; }
    updateBadge(); renderRecords(); showToast(`✅ Restored ${n} record(s)`);
  } catch (err) { showToast('⚠️ Invalid backup file'); }
  e.target.value = '';
}

// IMAGES — downscaled to keep records small
// ═════════════════════════════════════════════════════════════════
let uploadTarget = null;
function readImage(file) {
  return new Promise(res => { const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => { const max = 1400, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.82)); }; img.onerror = () => res(null); img.src = fr.result; };
    fr.onerror = () => res(null); fr.readAsDataURL(file); });
}

    if (b.dataset.act === 'edit') { loadInto(r.region||'lumbar', r.v, r.images, r.id); switchPage('form'); $$('.section-card').forEach(c=>c.classList.add('open')); showToast('✎ Editing ' + (r.v['pt.name']||'record')); }
    if (b.dataset.act === 'reassess') { const keep = carryOver(r.v); keep['pt.date'] = today(); keep['sign.date'] = today(); const ps = primaryScore(r);
      keep['hx.hopi'] = `Re-assessment. Previous assessment ${r.v['pt.date']||''}${r.v['dx.primary']?' — '+r.v['dx.primary']:''}${ps?' — '+ps:''}.`;
      loadInto(r.region||'lumbar', keep, null, null); switchPage('form'); $('#sec-pt').classList.add('open'); showToast('↻ Re-assessment started'); }
    if (b.dataset.act === 'del' && await askConfirm('Delete this assessment permanently?', 'Delete')) { await dbDel(r.id); if (currentId === r.id) setEditing(null); updateBadge(); renderRecords(); showToast('🗑️ Deleted'); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeReport(); });
}

// INIT
bind();
const hashRegion = (location.hash||'').slice(1);
initDB().then(() => {
  updateBadge();
  const d = loadDraft();
  if (d && d.v && (hasClinicalData(d.v) || has(d.v['pt.name']))) {
    loadInto(REGIONS[d.region] ? d.region : 'lumbar', d.v, d.images, RECORDS.some(r=>r.id===d.id) ? d.id : null);
    showToast('📝 Unsaved draft restored');
  } else newForm(REGIONS[hashRegion] ? hashRegion : 'lumbar');
  $('#sec-pt').classList.add('open');
});

</script>
</body>
</html>
