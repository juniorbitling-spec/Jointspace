<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joint Space — Back Assessment</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --green:#6b8c2a;--green2:#7fa832;--green-light:#eef4d6;--green-mid:#d4e890;
  --ink:#1a2410;--ink2:#3a4a20;--ink3:#6b7a50;--muted:#9aaa80;
  --bg:#f4f7ee;--white:#fff;--surface:#f9fbf4;--border:#dde8c0;--border2:#ccd8a0;
  --red:#c0392b;--red-light:#fde8e6;--amber:#d4820a;--amber-light:#fef3dc;
  --blue:#2563a8;--blue-light:#dbeafe;--shadow:0 2px 8px rgba(107,140,42,0.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',sans-serif;min-height:100dvh;padding-bottom:40px;}
button{font-family:'Nunito',sans-serif;}

/* NAV */
.nav-bar{background:linear-gradient(135deg,#2d4a0e 0%,#5a7a20 100%);position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,0.18);}
.nav-top{display:flex;align-items:center;gap:10px;padding:12px 16px 8px;}
.brand-name{font-size:18px;font-weight:900;color:#fff;line-height:1;}
.brand-sub{font-size:10px;color:rgba(255,255,255,0.65);letter-spacing:0.15em;text-transform:uppercase;margin-top:1px;}
.nav-link{margin-left:auto;font-size:11px;font-weight:800;color:#fff;text-decoration:none;background:rgba(255,255,255,0.15);padding:6px 10px;border-radius:8px;white-space:nowrap;}
.nav-tabs{display:flex;border-top:1px solid rgba(255,255,255,0.12);}
.nav-tab{flex:1;padding:10px 6px;text-align:center;font-size:11px;font-weight:800;color:rgba(255,255,255,0.55);cursor:pointer;border:none;border-bottom:3px solid transparent;background:none;letter-spacing:0.06em;}
.nav-tab.active{color:#fff;border-bottom-color:#a8d030;}
.tab-badge{background:var(--red);color:#fff;font-size:9px;font-weight:900;border-radius:10px;padding:1px 5px;margin-left:4px;display:none;}
.tab-badge.show{display:inline;}
.page{display:none;}.page.active{display:block;}
.wrap{max-width:980px;margin:0 auto;}

/* FORM */
.form-wrap{padding:12px;}
.form-head{background:linear-gradient(90deg,var(--green-light),var(--surface));border-radius:12px;padding:11px 13px;margin-bottom:11px;border:1px solid var(--border);}
.form-head-title{font-family:'Crimson Pro',serif;font-size:18px;font-weight:600;color:var(--ink2);}
.form-head-sub{font-size:12px;color:var(--ink3);font-style:italic;}
.edit-flag{display:none;margin-top:6px;font-size:11px;font-weight:800;color:var(--blue);background:var(--blue-light);border-radius:6px;padding:4px 8px;}
.edit-flag.show{display:inline-block;}
.sec-nav{display:flex;gap:5px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:thin;}
.sec-nav button{flex-shrink:0;background:var(--white);border:1.5px solid var(--border);border-radius:16px;padding:5px 10px;font-size:10px;font-weight:800;color:var(--ink3);cursor:pointer;white-space:nowrap;}
.sec-nav button.filled{border-color:var(--green2);color:var(--green);background:var(--green-light);}
.tools-row{display:flex;gap:6px;margin-bottom:10px;}
.tools-row button{flex:1;background:var(--white);border:1.5px solid var(--border2);border-radius:8px;padding:7px;font-size:11px;font-weight:800;color:var(--ink2);cursor:pointer;}

.section-card{background:var(--white);border:1px solid var(--border);border-radius:13px;margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);scroll-margin-top:110px;}
.section-head{background:linear-gradient(90deg,var(--green-light),var(--surface));padding:10px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;}
.section-num{font-size:10px;font-weight:900;color:var(--green);background:var(--white);border:1.5px solid var(--green-mid);border-radius:5px;padding:2px 6px;}
.section-title{font-size:13px;font-weight:800;color:var(--ink);flex:1;}
.section-toggle{font-size:14px;color:var(--green);transition:transform 0.2s;}
.section-card.open .section-toggle{transform:rotate(180deg);}
.section-body{padding:12px 13px;display:none;}
.section-card.open .section-body{display:block;}

.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px 10px;margin-bottom:10px;}
.fgrid .full{grid-column:1/-1;}
.field-label{font-size:10px;font-weight:800;color:var(--ink3);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px;display:block;}
.field-label .hint{text-transform:none;letter-spacing:0;font-weight:600;color:var(--muted);}
.field-input,.field-select,.field-textarea{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;color:var(--ink);font-family:'Nunito',sans-serif;font-size:13px;font-weight:600;padding:8px 10px;outline:none;transition:border-color 0.2s;}
.field-input:focus,.field-select:focus,.field-textarea:focus{border-color:var(--green2);background:#fff;}
.field-textarea{resize:vertical;min-height:62px;line-height:1.5;}
.sub-head{font-size:10px;font-weight:900;color:var(--green);letter-spacing:0.14em;text-transform:uppercase;padding:8px 0 4px;border-bottom:1.5px solid var(--green-mid);margin:4px 0 8px;}
.note{font-size:11px;color:var(--ink3);background:var(--surface);border:1px dashed var(--border2);border-radius:8px;padding:7px 9px;margin-bottom:9px;line-height:1.5;}

.chips{display:flex;flex-wrap:wrap;gap:5px;}
.chip{background:var(--surface);border:1.5px solid var(--border);border-radius:7px;padding:5px 9px;font-size:11px;font-weight:700;color:var(--ink2);cursor:pointer;user-select:none;}
.chip.sel{background:var(--green-light);border-color:var(--green2);color:var(--green);}
.chips.vert{flex-direction:column;}
.chips.vert .chip{text-align:left;}

.table-wrap{overflow-x:auto;margin-bottom:8px;-webkit-overflow-scrolling:touch;}
.assess-table{width:100%;border-collapse:collapse;font-size:12px;}
.assess-table th{background:var(--green-light);color:var(--ink2);font-size:10px;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;padding:6px 7px;border:1px solid var(--border);text-align:left;white-space:nowrap;}
.assess-table td{border:1px solid var(--border);padding:4px 5px;vertical-align:middle;}
.assess-table tr:nth-child(even) td{background:var(--surface);}
.assess-table .row-label{font-weight:700;color:var(--ink2);font-size:11px;min-width:130px;}
.row-sub{display:block;font-size:10px;color:var(--muted);font-weight:600;}
.row-how{display:block;font-size:10px;color:var(--ink3);font-weight:600;font-style:italic;margin-top:2px;max-width:320px;}
.assess-table input,.assess-table select{width:100%;min-width:62px;border:none;background:transparent;font-family:'Nunito',sans-serif;font-size:12px;font-weight:600;color:var(--ink);outline:none;padding:3px;border-bottom:1.5px solid var(--border2);}
.assess-table input:focus,.assess-table select:focus{border-bottom-color:var(--green2);background:var(--green-light);}
.assess-table .grp td{background:var(--green-mid)!important;font-size:10px;font-weight:900;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink2);}

.pn{display:flex;gap:4px;min-width:130px;}
.pn-btn{flex:1;padding:6px 3px;border:1.5px solid var(--border);border-radius:6px;font-size:10px;font-weight:800;cursor:pointer;background:var(--surface);color:var(--ink3);}
.pn-btn.on[data-v=pos],.pn-btn.on[data-v=yes]{background:var(--red-light);border-color:var(--red);color:var(--red);}
.pn-btn.on[data-v=neg],.pn-btn.on[data-v=no]{background:var(--green-light);border-color:var(--green2);color:var(--green);}
.pn-btn.on[data-v=na]{border-color:var(--muted);color:var(--ink2);background:#eee;}

.nprs-row{display:grid;grid-template-columns:130px 1fr 44px;align-items:center;gap:9px;margin-bottom:8px;}
.nprs-row input{width:100%;accent-color:var(--green);}
.nprs-val{font-size:15px;font-weight:900;color:var(--green);text-align:center;background:var(--green-light);border-radius:6px;padding:3px 0;}

.q-item{border:1px solid var(--border);border-radius:9px;padding:8px 9px;margin-bottom:7px;}
.q-title{font-size:12px;font-weight:800;color:var(--ink2);margin-bottom:6px;}
.calc{background:var(--blue-light);border:1.5px solid rgba(37,99,168,0.25);color:var(--ink);border-radius:9px;padding:9px 11px;margin:4px 0 10px;font-size:12px;font-weight:700;line-height:1.55;}
.calc b{color:var(--blue);}
.calc.warn{background:var(--amber-light);border-color:rgba(212,130,10,0.4);}
.calc.alert{background:var(--red-light);border-color:rgba(192,57,43,0.4);}
.calc.alert b{color:var(--red);}

.img-upload-area{border:2px dashed var(--border2);border-radius:10px;padding:14px;text-align:center;cursor:pointer;background:var(--surface);margin-bottom:7px;}
.img-upload-area:hover{border-color:var(--green2);background:var(--green-light);}
.img-upload-text{font-size:12px;font-weight:700;color:var(--ink3);}
.img-previews{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px;}
.img-thumb{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:2px solid var(--border);}
.img-thumb img{width:100%;height:100%;object-fit:cover;}
.img-thumb button{position:absolute;top:2px;right:2px;background:var(--red);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer;}

.action-row{display:flex;gap:8px;padding:0 12px 14px;position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding-top:14px;}
.btn-main{flex:1;padding:12px;border:none;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;}
.btn-main:active{transform:scale(0.97);}
.btn-save{background:linear-gradient(135deg,#5a7a20,#7fa832);color:#fff;box-shadow:0 3px 10px rgba(107,140,42,0.3);}
.btn-print{background:var(--white);color:var(--ink2);border:1.5px solid var(--border2);}
.btn-clear{background:var(--red-light);color:var(--red);border:1.5px solid rgba(192,57,43,0.3);}

/* RECORDS */
.rec-page-header{padding:12px 12px 8px;}
.rec-search-row{display:flex;gap:7px;margin-bottom:8px;}
.rec-search{flex:1;min-width:0;background:var(--white);border:1.5px solid var(--border);border-radius:9px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:600;padding:9px 12px;outline:none;color:var(--ink);}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px;}
.stat-mini{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:10px 11px;box-shadow:var(--shadow);}
.sm-val{font-size:22px;font-weight:900;color:var(--green);}
.sm-lbl{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:0.07em;text-transform:uppercase;}
.rec-export-row{padding:0 12px 8px;display:flex;gap:7px;flex-wrap:wrap;}
.rec-export-btn{flex:1;min-width:110px;padding:10px;border:1.5px solid var(--border2);border-radius:9px;background:var(--white);font-size:12px;font-weight:800;color:var(--ink2);cursor:pointer;}
.rec-list{padding:0 12px 14px;}
.rec-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:9px;box-shadow:var(--shadow);}
.rec-name{font-size:15px;font-weight:900;color:var(--ink);}
.rec-date{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px;}
.rec-tags{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0;}
.rec-tag{font-size:10px;font-weight:700;background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:2px 7px;color:var(--ink3);}
.rec-tag.red{color:var(--red);border-color:rgba(192,57,43,0.25);}
.rec-tag.blue{color:var(--blue);}
.rec-actions{display:flex;gap:6px;flex-wrap:wrap;}
.rec-btn{flex:1;min-width:70px;padding:8px;border-radius:7px;font-size:11px;font-weight:800;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--ink2);}
.rec-btn.view{background:var(--green-light);color:var(--green);border-color:var(--green-mid);}
.rec-btn.del{background:var(--red-light);color:var(--red);border-color:rgba(192,57,43,0.2);}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted);font-size:13px;line-height:1.6;}
.empty-state h3{font-size:16px;font-weight:800;color:var(--ink2);margin:10px 0 6px;}

/* REPORT MODAL */
.modal-overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.6);overflow-y:auto;}
.modal-overlay.open{display:block;}
.modal-box{background:var(--white);border-radius:16px 16px 0 0;margin:24px auto 0;max-width:980px;min-height:calc(100dvh - 24px);}
.modal-head{position:sticky;top:0;background:linear-gradient(135deg,#2d4a0e,#5a7a20);padding:12px 14px;border-radius:16px 16px 0 0;display:flex;align-items:center;gap:8px;z-index:10;}
.modal-head-title{flex:1;font-size:14px;font-weight:900;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.modal-btn{background:rgba(255,255,255,0.2);border:none;border-radius:7px;padding:6px 11px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;}
.modal-body{padding:14px;}
.rep-banner{background:var(--green-light);border-radius:10px;padding:12px 13px;margin-bottom:12px;border:1px solid var(--green-mid);}
.rep-banner .t{font-family:'Crimson Pro',serif;font-size:19px;font-weight:600;}
.rep-banner .s{font-size:12px;color:var(--ink3);}
.rep-sec{margin-bottom:12px;border:1px solid var(--border);border-radius:10px;overflow:hidden;break-inside:avoid-page;}
.rep-sec-head{background:var(--green-light);padding:7px 12px;font-size:11px;font-weight:900;color:var(--ink2);border-bottom:1px solid var(--border);letter-spacing:0.08em;text-transform:uppercase;}
.rep-sec-body{padding:9px 12px;font-size:12.5px;line-height:1.6;color:var(--ink2);}
.rep-sub{font-size:10px;font-weight:900;color:var(--green);letter-spacing:0.12em;text-transform:uppercase;margin:8px 0 4px;}
.rep-kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 14px;}
.rep-kv div{padding:2px 0;border-bottom:1px dotted var(--border);}
.rep-kv .full{grid-column:1/-1;white-space:pre-wrap;}
.rep-kv b{color:var(--ink);font-weight:800;}
.rep-table{width:100%;border-collapse:collapse;font-size:11.5px;margin:3px 0 6px;}
.rep-table th{background:var(--surface);font-size:10px;text-transform:uppercase;letter-spacing:0.04em;text-align:left;padding:4px 6px;border:1px solid var(--border);}
.rep-table td{padding:4px 6px;border:1px solid var(--border);}
.tag{display:inline-block;border-radius:5px;padding:2px 8px;font-size:11.5px;font-weight:700;margin:2px 3px 2px 0;}
.tag.pos{background:var(--red-light);color:var(--red);border:1px solid rgba(192,57,43,0.2);}
.tag.ok{background:var(--green-light);color:var(--green);border:1px solid var(--green-mid);}
.tag.info{background:var(--blue-light);color:var(--blue);}
.rep-imgs{display:flex;flex-wrap:wrap;gap:8px;}
.rep-imgs img{height:150px;border-radius:8px;border:1px solid var(--border);}
.rep-foot{text-align:center;padding:14px 0 4px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:0.07em;}
.sign-line{display:flex;justify-content:space-between;gap:20px;margin-top:26px;font-size:11px;color:var(--ink3);}
.sign-line div{flex:1;border-top:1px solid var(--ink3);padding-top:4px;text-align:center;}

.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:11px 20px;border-radius:28px;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}

@media (max-width:520px){
  .nprs-row{grid-template-columns:96px 1fr 40px;}
  .fgrid{grid-template-columns:1fr 1fr;}
  .nav-link{font-size:10px;padding:5px 8px;}
}
@media print{
  body{background:#fff;padding:0;}
  body.printing>*:not(#view-modal){display:none!important;}
  #view-modal{position:static;background:none;display:block!important;overflow:visible;}
  .modal-box{margin:0;border-radius:0;min-height:0;max-width:none;}
  .modal-head{display:none!important;}
  .modal-body{padding:0;}
  .rep-sec{border-color:#bbb;}
  @page{margin:12mm;}
}
</style>
</head>
<body>

<div class="nav-bar">
  <div class="wrap">
    <div class="nav-top">
      <div style="width:38px;height:38px;background:rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">🦴</div>
      <div><div class="brand-name">Joint Space</div><div class="brand-sub">Back Assessment Proforma</div></div>
      <a class="nav-link" href="JointSpace-Assessment-v2.html">All joints →</a>
    </div>
    <div class="nav-tabs">
      <button class="nav-tab active" data-page="form">📋 Assessment</button>
      <button class="nav-tab" data-page="records">📂 Saved Records <span class="tab-badge" id="rec-badge">0</span></button>
    </div>
  </div>
</div>

<div class="page active" id="page-form">
  <div class="wrap">
    <div class="form-wrap">
      <div class="form-head">
        <div class="form-head-title">Lumbar Spine · Sacroiliac · Back Assessment</div>
        <div class="form-head-sub">Detailed physiotherapy proforma — subjective, objective, ROM, MMT, neuro, special tests, MRI &amp; plan</div>
        <span class="edit-flag" id="edit-flag"></span>
      </div>
      <div class="sec-nav" id="sec-nav"></div>
      <div class="tools-row">
        <button id="btn-expand">⤢ Expand all</button>
        <button id="btn-collapse">⤡ Collapse all</button>
        <button id="btn-new">＋ New patient</button>
      </div>
      <div id="assessment-form"></div>
    </div>
    <div class="action-row">
      <button class="btn-main btn-save" id="btn-save">💾 Save</button>
      <button class="btn-main btn-print" id="btn-report">📄 Report / Print</button>
      <button class="btn-main btn-clear" id="btn-clear">↺ Clear</button>
    </div>
  </div>
</div>

<div class="page" id="page-records">
  <div class="wrap">
    <div class="rec-page-header">
      <div class="rec-search-row">
        <input class="rec-search" type="text" id="rec-search" placeholder="🔍 Search name, case no, diagnosis, level…">
      </div>
      <div class="stats-row" id="rec-stats"></div>
    </div>
    <div class="rec-export-row">
      <button class="rec-export-btn" id="btn-csv">📥 Export CSV</button>
      <button class="rec-export-btn" id="btn-json" style="color:var(--blue)">💾 Backup (JSON)</button>
      <button class="rec-export-btn" id="btn-import" style="color:var(--amber)">📤 Restore</button>
    </div>
    <input type="file" id="import-file" accept=".json" style="display:none">
    <div class="rec-list" id="records-list"></div>
  </div>
</div>

<div class="modal-overlay" id="view-modal">
  <div class="modal-box">
    <div class="modal-head">
      <button class="modal-btn" id="btn-close">✕ Close</button>
      <div class="modal-head-title" id="modal-title">Report</div>
      <button class="modal-btn" id="btn-print">🖨️ Print / PDF</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
<input type="file" id="img-input" accept="image/*" multiple style="display:none">
<div class="toast" id="toast"></div>

<script>
// ═════════════════════════════════════════════════════════════════
// OPTION LISTS
// ═════════════════════════════════════════════════════════════════
const MRC = ['0','1','2','3-','3','3+','4-','4','4+','5','NT'];
const REFLEX = ['0 Absent','1+ Diminished','2+ Normal','3+ Brisk','4+ Clonus'];
const SENS = ['Normal','Reduced','Absent','Hyperaesthesia','Paraesthesia'];
const ENDFEEL = ['Normal','Firm/capsular','Hard (bony)','Springy block','Empty (pain)','Spasm'];
const PAINROM = ['No pain','Pain at end range','Pain through range','Painful arc','Reproduces leg pain'];
const LIMIT = ['Full','Minimal loss','Moderate loss','Major loss','Nil'];
const MOB = ['Normal','Hypomobile','Hypermobile'];
const PAINRESP = ['None','Local pain','Comparable (reproduces)','Referred'];
const TENDER = ['0 None','1 Mild','2 Winces','3 Withdraws','4 Untouchable'];
const TONE = ['Normal','Increased/spasm','Decreased','Trigger points'];
const GRADE4 = ['None','Mild','Moderate','Severe'];
const LEVELS = ['T12–L1','L1–L2','L2–L3','L3–L4','L4–L5','L5–S1'];

// ═════════════════════════════════════════════════════════════════
// FORM SCHEMA  — every input is keyed so it is saved, re-editable and printed
// Field: {k,l,t:'text'|'num'|'date'|'sel'|'ta'|'chip'|'multi',o,ph,full,u}
// Blocks: {h}, {note}, {f:[fields]}, {tbl}, {tests}, {q}, {calc}, {nprs}, {img}
// ═════════════════════════════════════════════════════════════════

// HELPERS
// ═════════════════════════════════════════════════════════════════
const $ = s => document.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const has = v => Array.isArray(v) ? v.length > 0 : v !== undefined && v !== null && String(v).trim() !== '';
const num = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };
const today = () => new Date().toISOString().slice(0,10);
const isRow = r => Array.isArray(r);
function showToast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400); }

// ═════════════════════════════════════════════════════════════════
// FORM RENDERING
// ═════════════════════════════════════════════════════════════════
function ctl(key, c, cls='') {
  const t = c.t || 'text';
  if (t === 'sel') return `<select data-k="${key}" class="${cls}"><option value="">—</option>${c.o.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
  if (t === 'ta') return `<textarea data-k="${key}" class="${cls}" placeholder="${esc(c.ph||'')}"></textarea>`;
  if (t === 'chip' || t === 'multi') return `<div class="chips" data-k="${key}"${t==='multi'?' data-multi="1"':''}>${c.o.map(o=>`<span class="chip" data-v="${esc(o)}">${esc(o)}</span>`).join('')}</div>`;
  const it = t === 'num' ? 'number' : t === 'date' ? 'date' : 'text';
  return `<input type="${it}" data-k="${key}" class="${cls}" placeholder="${esc(c.ph||'')}"${it==='number'?' step="any" inputmode="decimal"':''}>`;
}
function fieldHTML(f) {
  const cls = f.t==='sel' ? 'field-select' : f.t==='ta' ? 'field-textarea' : 'field-input';
  const full = f.full || f.t==='ta' || f.t==='multi';
  return `<div class="${full?'full':''}"><label class="field-label">${esc(f.l)}${f.u?` <span class="hint">(${esc(f.u)})</span>`:''}</label>${ctl(f.k,f,cls)}</div>`;
}
function pnHTML(key, yn) {
  const opts = yn ? [['yes','YES'],['no','NO']] : [['pos','POS'],['neg','NEG'],['na','N/A']];
  return `<div class="pn" data-k="${key}">${opts.map(([v,l])=>`<button type="button" class="pn-btn" data-v="${v}">${l}</button>`).join('')}</div>`;
}
function tableHTML(tb) {
  let ri = 0;
  const body = tb.rows.map(r => {
    if (!isRow(r)) return `<tr class="grp"><td colspan="${tb.cols.length+1}">${esc(r.g)}</td></tr>`;
    const i = ri++;
    return `<tr><td class="row-label">${esc(r[0])}${r[1]?`<span class="row-sub">${esc(r[1])}</span>`:''}</td>${tb.cols.map((c,ci)=>`<td>${ctl(`${tb.k}.${i}.${ci}`,c)}</td>`).join('')}</tr>`;
  }).join('');
  return `<div class="table-wrap"><table class="assess-table"><thead><tr><th>${tb.first||'Item'}</th>${tb.cols.map(c=>`<th>${esc(c.h)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function testsHTML(ts) {
  let ri = 0;
  const cols = ts.yn ? 2 : 4;
  const body = ts.rows.map(r => {
    if (!isRow(r)) return `<tr class="grp"><td colspan="${cols}">${esc(r.g)}</td></tr>`;
    const i = ri++, [name, purpose, sides, how] = r;
    const lbl = `<td class="row-label">${esc(name)}<span class="row-sub">${esc(purpose)}</span>${how?`<span class="row-how">${esc(how)}</span>`:''}</td>`;
    if (ts.yn) return `<tr>${lbl}<td>${pnHTML(`${ts.k}.${i}`,1)}</td></tr>`;
    const cells = sides === 2 ? `<td>${pnHTML(`${ts.k}.${i}.L`)}</td><td>${pnHTML(`${ts.k}.${i}.R`)}</td>` : `<td colspan="2">${pnHTML(`${ts.k}.${i}.C`)}</td>`;
    return `<tr>${lbl}${cells}<td><input type="text" data-k="${ts.k}.${i}.f" placeholder="Findings…"></td></tr>`;
  }).join('');
  const head = ts.yn ? '<th>Item</th><th>Present?</th>' : '<th>Test &amp; purpose</th><th>Left</th><th>Right</th><th>Findings</th>';
  return `<div class="table-wrap"><table class="assess-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function blockHTML(b) {
  if (b.h) return `<div class="sub-head">${esc(b.h)}</div>`;
  if (b.note) return `<div class="note">${b.note}</div>`;
  if (b.f) return `<div class="fgrid">${b.f.map(fieldHTML).join('')}</div>`;
  if (b.tbl) return tableHTML(b.tbl);
  if (b.tests) return testsHTML(b.tests);
  if (b.calc) return `<div class="calc" data-calc="${b.calc}"></div>`;
  if (b.nprs) return b.nprs.map(([k,l])=>`<div class="nprs-row"><label class="field-label" style="margin:0">${esc(l)}</label><input type="range" min="0" max="10" step="1" value="0" data-k="${k}" data-nprs="1"><span class="nprs-val" data-show="${k}">–</span></div>`).join('');
  if (b.q) return b.q.items.map(([title, opts], i) => `<div class="q-item"><div class="q-title">${esc(title)}</div><div class="chips ${opts.length>2?'vert':''}" data-k="${b.q.k}.${i}">${opts.map((o,oi)=>`<span class="chip" data-v="${oi}">${opts.length>2&&b.q.k==='odi'?oi+' — ':''}${esc(o)}</span>`).join('')}</div></div>`).join('');
  if (b.img) return `<div class="sub-head">📎 ${b.img==='mri'?'MRI images / report scans':b.img==='posture'?'Posture photographs':'Other reports / images'}</div>
    <div class="img-upload-area" data-upload="${b.img}"><div style="font-size:24px">🩻</div><div class="img-upload-text">Tap to add images (JPG / PNG)</div></div>
    <div class="img-previews" data-imgs="${b.img}"></div>`;
  return '';
}
function buildForm() {
  $('#assessment-form').innerHTML = SECTIONS.map((s,n) => `
    <div class="section-card" id="sec-${s.id}">
      <div class="section-head" data-toggle="${s.id}"><span class="section-num">${n+1}</span><span class="section-title">${esc(s.t)}</span><span class="section-toggle">▼</span></div>
      <div class="section-body">${s.b.map(blockHTML).join('')}</div>
    </div>`).join('');
  $('#sec-nav').innerHTML = SECTIONS.map((s,n)=>`<button data-jump="${s.id}">${n+1}. ${esc(s.t.split(/ [—&(]/)[0])}</button>`).join('');
}

let IMAGES = { mri:[], posture:[], other:[] };
function getVals() {
  const v = {};
  $$('#assessment-form [data-k]').forEach(el => {
    const k = el.dataset.k;
    let val;
    if (el.classList.contains('chips')) {
      const sel = $$('.chip.sel', el).map(c => c.dataset.v);
      val = el.dataset.multi ? sel : (sel[0] || '');
    } else if (el.classList.contains('pn')) {
      val = el.dataset.val || '';
    } else if (el.dataset.nprs) {
      val = el.dataset.set ? el.value : '';
    } else val = el.value;
    if (has(val)) v[k] = val;
  });
  return v;
}
function setVals(v) {
  $$('#assessment-form [data-k]').forEach(el => {
    const k = el.dataset.k, val = v[k];
    if (el.classList.contains('chips')) {
      const arr = Array.isArray(val) ? val : has(val) ? [String(val)] : [];
      $$('.chip', el).forEach(c => c.classList.toggle('sel', arr.includes(c.dataset.v)));
    } else if (el.classList.contains('pn')) {
      el.dataset.val = val || '';
      $$('.pn-btn', el).forEach(b => b.classList.toggle('on', b.dataset.v === val));
    } else if (el.dataset.nprs) {
      el.value = has(val) ? val : 0;
      if (has(val)) el.dataset.set = '1'; else delete el.dataset.set;
    } else el.value = has(val) ? val : '';
  });
  $$('[data-nprs]').forEach(updNprs);
}
function updNprs(el) {
  const s = $(`[data-show="${el.dataset.k}"]`);
  if (s) { s.textContent = el.dataset.set ? el.value : '–'; s.style.color = !el.dataset.set ? '' : el.value>=7 ? 'var(--red)' : el.value>=4 ? 'var(--amber)' : 'var(--green)'; }
}
function renderImages() {
  Object.keys(IMAGES).forEach(g => {
    const box = $(`[data-imgs="${g}"]`);
    if (box) box.innerHTML = IMAGES[g].map((src,i)=>`<div class="img-thumb"><img src="${src}" alt=""><button type="button" data-delimg="${g}.${i}">✕</button></div>`).join('');
  });
}

// ═════════════════════════════════════════════════════════════════
// AUTO-CALCULATIONS
// ═════════════════════════════════════════════════════════════════
function stRows() { return SECTIONS.find(s=>s.id==='st').b.find(b=>b.tests).tests.rows.filter(isRow); }
function stIndex(name) { return stRows().findIndex(r => r[0].startsWith(name)); }
function stPos(v, name) { const i = stIndex(name); return ['L','R','C'].filter(s => v[`st.${i}.${s}`]==='pos'); }
function listRows(k) { for (const s of SECTIONS) for (const b of s.b) { if (b.tests?.k===k) return b.tests.rows.filter(isRow); if (b.tbl?.k===k) return b.tbl.rows.filter(isRow); } return []; }

const CALC = {
  bmi(v) {
    const h = num(v['pt.ht']), w = num(v['pt.wt']);
    if (!h || !w) return null;
    const b = w / Math.pow(h/100, 2);
    const cat = b < 18.5 ? 'Underweight' : b < 23 ? 'Normal (Asian cut-off)' : b < 25 ? 'Overweight (Asian cut-off)' : b < 30 ? 'Pre-obese / overweight' : 'Obese';
    return { html:`BMI: <b>${b.toFixed(1)} kg/m²</b> — ${cat}`, lvl: b>=30 ? 'warn' : '' };
  },
  rf(v) {
    const rows = listRows('rf'); const yes = rows.map((r,i)=>v['rf.'+i]==='yes'?r:null).filter(Boolean);
    if (!rows.some((r,i)=>has(v['rf.'+i]))) return null;
    const ces = yes.filter(r=>r[1]==='Cauda equina');
    if (ces.length) return { html:`🚨 <b>${ces.length} cauda equina sign(s) present</b> — URGENT emergency referral / MRI. Total red flags: ${yes.length}`, lvl:'alert' };
    if (yes.length) return { html:`⚠️ <b>${yes.length} red flag(s) present</b>: ${yes.map(r=>esc(r[1])).filter((x,i,a)=>a.indexOf(x)===i).join(', ')} — consider medical review before treatment.`, lvl:'alert' };
    return { html:`✅ <b>No red flags</b> identified on screening.` };
  },
  yf(v) {
    const rows = listRows('yf'); const n = rows.filter((r,i)=>v['yf.'+i]==='yes').length;
    if (!rows.some((r,i)=>has(v['yf.'+i]))) return null;
    return { html:`Yellow flags present: <b>${n} / ${rows.length}</b>${n>=3?' — high psychosocial risk; consider CBT-informed / graded approach.':''}`, lvl: n>=3?'warn':'' };
  },
  odi(v) {
    const ans = [...Array(10).keys()].map(i=>v['odi.'+i]).filter(has).map(Number);
    if (!ans.length) return null;
    const pct = Math.round(ans.reduce((a,b)=>a+b,0) / (ans.length*5) * 100);
    const band = pct<=20?'Minimal disability':pct<=40?'Moderate disability':pct<=60?'Severe disability':pct<=80?'Crippled':'Bed-bound / exaggerating';
    return { html:`ODI: <b>${pct}%</b> — ${band} <span style="font-weight:600;color:var(--ink3)">(${ans.length}/10 sections answered; MCID ≈ 10 points)</span>`, lvl: pct>40?'warn':'', val:pct, band };
  },
  sb(v) {
    const a = [...Array(9).keys()].map(i=>v['sb.'+i]);
    if (!a.some(has)) return null;
    const sc = a.map((x,i)=> i<8 ? (x==='1'?1:0) : (x==='3'||x==='4'?1:0));
    const total = sc.reduce((p,c)=>p+c,0), psych = sc.slice(4).reduce((p,c)=>p+c,0);
    const risk = total<=3 ? 'LOW risk' : psych<=3 ? 'MEDIUM risk' : 'HIGH risk';
    const adv = total<=3 ? 'advice, reassurance, self-management' : psych<=3 ? 'physiotherapy-led exercise & manual therapy' : 'psychologically informed physiotherapy';
    return { html:`STarT Back: total <b>${total}/9</b>, psychosocial subscale <b>${psych}/5</b> → <b>${risk}</b> (${adv})${a.some(x=>!has(x))?' <span style="color:var(--ink3)">— incomplete</span>':''}`, lvl: risk==='HIGH risk'?'alert':risk==='MEDIUM risk'?'warn':'', risk };
  },
  fabq(v) {
    const pa = num(v['om.fabqpa']), w = num(v['om.fabqw']);
    if (pa===null && w===null) return null;
    const p = [];
    if (pa!==null) p.push(`FABQ-PA <b>${pa}</b>${pa>15?' (elevated > 15)':''}`);
    if (w!==null) p.push(`FABQ-W <b>${w}</b>${w>34?' (high risk of not returning to work > 34)':w<19?' (< 19 favours manipulation)':''}`);
    return { html:p.join(' · '), lvl:(pa>15||w>34)?'warn':'' };
  },
  mcgill(v) {
    const e=num(v['core.bs']), f=num(v['core.flex']), l=num(v['core.sbl']), r=num(v['core.sbr']);
    const p=[];
    if (e && f) { const x=f/e; p.push(`Flexor : extensor <b>${x.toFixed(2)}</b>${x>1?' ⚠ (> 1.0 abnormal)':''}`); }
    if (l && r) { const x=r/l; p.push(`Side bridge R : L <b>${x.toFixed(2)}</b>${Math.abs(1-x)>0.05?' ⚠ (> 0.05 asymmetry)':''}`); }
    if (e && (l||r)) { const x=(l||r)/e; p.push(`Side bridge : extensor <b>${x.toFixed(2)}</b>${x>0.75?' ⚠ (> 0.75 abnormal)':''}`); }
    if (e!==null) p.push(`Sørensen <b>${e}s</b>${e<176?' (< 176 s ↑ LBP risk)':''}`);
    return p.length ? { html:'McGill endurance ratios: '+p.join(' · ') } : null;
  },
  laslett(v) {
    const d=stPos(v,'SIJ Distraction').length>0, c=stPos(v,'SIJ Compression').length>0, t=stPos(v,'Thigh thrust').length>0, s=stPos(v,'Sacral thrust').length>0;
    const g=stPos(v,'Gaenslen');
    const tested = ['SIJ Distraction','SIJ Compression','Thigh thrust','Sacral thrust','Gaenslen'].some(n=>{const i=stIndex(n);return ['L','R','C'].some(x=>has(v[`st.${i}.${x}`]));});
    if (!tested) return null;
    const four = [d,c,t,s].filter(Boolean).length, six = four + g.length;
    const pos = six>=3 || four>=2;
    return { html:`Laslett SIJ cluster: <b>${six}/6</b> provocation tests + (4-test subset: ${four}/4) → <b>${pos?'POSITIVE — SIJ likely pain source':'Negative'}</b> <span style="color:var(--ink3);font-weight:600">(≥ 3/6 or ≥ 2 of distraction, thigh thrust, sacral thrust, compression; valid when repeated movements do not centralise)</span>`, lvl: pos?'warn':'', pos };
  },
  waddell(v) {
    const n = [1,2,3,4,5].filter(i => stPos(v,'W'+i).length).length;
    const tested = [1,2,3,4,5].some(i=>{const k=stIndex('W'+i);return has(v[`st.${k}.C`]);});
    if (!tested) return null;
    return { html:`Waddell non-organic signs: <b>${n}/5</b>${n>=3?' — clinically significant; consider psychosocial contribution (not malingering per se)':''}`, lvl: n>=3?'warn':'', n };
  },
  cpr(v) {
    const f=(v['cpr.flynn']||[]).length, h=(v['cpr.hicks']||[]).length, c=(v['cpr.cook']||[]).length;
    if (!f && !h && !c) return null;
    const p=[];
    if (f) p.push(`Manipulation <b>${f}/5</b>${f>=4?' ✔ likely responder':''}`);
    if (h) p.push(`Stabilisation <b>${h}/4</b>${h>=3?' ✔ likely responder':''}`);
    if (c) p.push(`Stenosis <b>${c}/5</b>${c>=3?' ✔ stenosis likely':''}`);
    return { html:'CPR: '+p.join(' · ') };
  },
  mri(v) {
    const rows = [];
    LEVELS.forEach((l,i) => {
      const disc=v[`mrid.${i}.0`], loc=v[`mrid.${i}.1`], canal=v[`mric.${i}.0`], root=v[`mric.${i}.6`], lis=v[`mric.${i}.11`];
      const bits=[];
      if (disc && disc!=='Normal') bits.push(disc + (loc?` (${loc})`:''));
      if (canal && canal!=='None') bits.push(`${canal} canal stenosis`);
      ['2','3','4','5'].forEach((c,j)=>{const x=v[`mric.${i}.${c}`]; if(x && x!=='None') bits.push(`${x} ${['L lat. recess','R lat. recess','L foraminal','R foraminal'][j]} stenosis`);});
      if (root) bits.push('root: '+root);
      if (lis && lis!=='None') bits.push(lis);
      if (bits.length) rows.push(`<b>${l}</b>: ${esc(bits.join(', '))}`);
    });
    return rows.length ? { html:'MRI summary — '+rows.join('<br>') , list:rows } : null;
  },
  psfs(v) {
    const s=[0,1,2,3,4].map(i=>num(v[`psfs.${i}.1`])).filter(x=>x!==null);
    return s.length ? { html:`PSFS mean: <b>${(s.reduce((a,b)=>a+b,0)/s.length).toFixed(1)}/10</b> (MCID ≈ 2 points)` } : null;
  },
};
function recompute() {
  const v = getVals();
  $$('[data-calc]').forEach(el => {
    const r = CALC[el.dataset.calc](v);
    el.style.display = r ? '' : 'none';
    el.className = 'calc' + (r?.lvl ? ' '+r.lvl : '');
    if (r) el.innerHTML = r.html;
  });
  // section filled indicator
  SECTIONS.forEach(s => {
    const card = $('#sec-'+s.id);
    const filled = $$('[data-k]', card).some(el => { const k=el.dataset.k; return has(v[k]) && !(k==='pt.date'); });
    $(`[data-jump="${s.id}"]`)?.classList.toggle('filled', filled);
  });
  return v;
}

// ═════════════════════════════════════════════════════════════════
// STORAGE — IndexedDB (records) + localStorage (draft)
// ═════════════════════════════════════════════════════════════════
let db = null, RECORDS = [], currentId = null;
const DRAFT_KEY = 'jointspace_back_draft';
function initDB() {
  return new Promise(res => {
    try {
      const rq = indexedDB.open('JointSpaceBackDB', 1);
      rq.onupgradeneeded = e => { const d = e.target.result; if (!d.objectStoreNames.contains('records')) d.createObjectStore('records', { keyPath:'id' }); };
      rq.onsuccess = e => { db = e.target.result; const tx = db.transaction('records','readonly').objectStore('records').getAll(); tx.onsuccess = () => { RECORDS = tx.result || []; res(); }; tx.onerror = () => res(); };
      rq.onerror = () => res();
    } catch (e) { res(); }
  });
}
function dbPut(rec) {
  return new Promise(res => {
    const i = RECORDS.findIndex(r => r.id === rec.id);
    if (i >= 0) RECORDS[i] = rec; else RECORDS.push(rec);
    if (!db) return res();
    try { const tx = db.transaction('records','readwrite'); tx.objectStore('records').put(rec); tx.oncomplete = res; tx.onerror = res; } catch (e) { res(); }
  });
}
function dbDel(id) {
  return new Promise(res => {
    RECORDS = RECORDS.filter(r => r.id !== id);
    if (!db) return res();
    try { const tx = db.transaction('records','readwrite'); tx.objectStore('records').delete(id); tx.oncomplete = res; tx.onerror = res; } catch (e) { res(); }
  });
}
let draftTimer;
function saveDraft() {
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => { try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ v:getVals(), images:IMAGES, id:currentId })); } catch (e) {} }, 500);
}
function loadDraft() { try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) { return null; } }
function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }

function updateBadge() { const b = $('#rec-badge'); b.textContent = RECORDS.length; b.classList.toggle('show', RECORDS.length > 0); }
function setEditing(id) {
  currentId = id;
  const f = $('#edit-flag');
  const r = RECORDS.find(x => x.id === id);
  f.textContent = r ? `✎ Editing saved record — ${r.v['pt.name']||'Unnamed'}` : '';
  f.classList.toggle('show', !!r);
}
function loadIntoForm(v, images, id) {
  setVals(v || {});
  IMAGES = { mri:[], posture:[], other:[], ...(images ? JSON.parse(JSON.stringify(images)) : {}) };
  renderImages();
  setEditing(id ?? null);
  recompute();
}
function newForm() {
  loadIntoForm({ 'pt.date':today(), 'sign.date':today() }, null, null);
  clearTimeout(draftTimer);
  clearDraft();
  $$('.section-card').forEach((c,i)=>c.classList.toggle('open', i===0));
  window.scrollTo({ top:0 });
}

async function saveAssessment() {
  const v = recompute();
  if (!has(v['pt.name'])) { showToast('⚠️ Enter patient name first'); openSection('pt'); return; }
  const old = RECORDS.find(r => r.id === currentId);
  const rec = { id: currentId || Date.now(), createdAt: old?.createdAt || new Date().toISOString(), savedAt: new Date().toISOString(), v, images: IMAGES };
  await dbPut(rec);
  setEditing(rec.id);
  clearTimeout(draftTimer);
  clearDraft();
  updateBadge();
  showToast('✅ Saved — ' + v['pt.name']);
}

// ═════════════════════════════════════════════════════════════════
// REPORT (view / print) — line-by-line detail of every recorded item
// ═════════════════════════════════════════════════════════════════
function fmt(val) { return Array.isArray(val) ? val.join(', ') : val; }
const PN_TXT = { pos:'POS', neg:'NEG', na:'N/A', yes:'YES', no:'NO' };
function pnTag(x) { return x ? `<span class="tag ${x==='pos'||x==='yes'?'pos':x==='neg'||x==='no'?'ok':'info'}">${PN_TXT[x]}</span>` : '—'; }

function repBlock(b, v, s) {
  if (b.f) {
    const items = b.f.filter(f => has(v[f.k]));
    if (!items.length) return '';
    return `<div class="rep-kv">${items.map(f=>`<div class="${f.t==='ta'||f.full?'full':''}"><b>${esc(f.l.replace(' *',''))}:</b> ${esc(fmt(v[f.k]))}${f.u&&!Array.isArray(v[f.k])?' '+esc(f.u):''}</div>`).join('')}</div>`;
  }
  if (b.tbl) {
    const tb = b.tbl; let ri = 0; const rows = [];
    tb.rows.forEach(r => {
      if (!isRow(r)) return; const i = ri++;
      const cells = tb.cols.map((c,ci)=>v[`${tb.k}.${i}.${ci}`]);
      if (cells.some(has)) rows.push(`<tr><td><b>${esc(r[0])}</b>${r[1]?`<br><span style="color:var(--muted);font-size:10px">${esc(r[1])}</span>`:''}</td>${cells.map(x=>`<td>${has(x)?esc(x):'—'}</td>`).join('')}</tr>`);
    });
    if (!rows.length) return '';
    return `<div style="overflow-x:auto"><table class="rep-table"><thead><tr><th>Item</th>${tb.cols.map(c=>`<th>${esc(c.h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
  }
  if (b.tests) {
    const ts = b.tests; let ri = 0; const rows = []; let grp = null;
    ts.rows.forEach(r => {
      if (!isRow(r)) { grp = r.g; return; } const i = ri++;
      if (ts.yn) { const x = v[`${ts.k}.${i}`]; if (has(x)) rows.push({grp, html:`<tr><td>${esc(r[0])}<br><span style="color:var(--muted);font-size:10px">${esc(r[1])}</span></td><td>${pnTag(x)}</td></tr>`}); return; }
      const L=v[`${ts.k}.${i}.L`], R=v[`${ts.k}.${i}.R`], C=v[`${ts.k}.${i}.C`], F=v[`${ts.k}.${i}.f`];
      if ([L,R,C,F].some(has)) rows.push({grp, html:`<tr><td><b>${esc(r[0])}</b><br><span style="color:var(--muted);font-size:10px">${esc(r[1])}</span></td>${r[2]===2?`<td>${pnTag(L)}</td><td>${pnTag(R)}</td>`:`<td colspan="2" style="text-align:center">${pnTag(C)}</td>`}<td>${esc(F||'')}</td></tr>`});
    });
    if (!rows.length) return '';
    let last = null;
    const cols = ts.yn ? 2 : 4;
    const body = rows.map(x => { const g = x.grp && x.grp!==last ? `<tr><td colspan="${cols}" style="background:var(--green-light);font-weight:900;font-size:10px;letter-spacing:.08em;text-transform:uppercase">${esc(x.grp)}</td></tr>` : ''; last = x.grp; return g + x.html; }).join('');
    return `<table class="rep-table"><thead><tr>${ts.yn?'<th>Item</th><th>Present</th>':'<th>Test</th><th>Left</th><th>Right</th><th>Findings</th>'}</tr></thead><tbody>${body}</tbody></table>`;
  }
  if (b.nprs) {
    const items = b.nprs.filter(([k])=>has(v[k]));
    return items.length ? `<div>${items.map(([k,l])=>{const n=+v[k];return `<span class="tag ${n>=7?'pos':n>=4?'info':'ok'}">${esc(l)}: ${n}/10</span>`;}).join('')}</div>` : '';
  }
  if (b.q) {
    const ans = b.q.items.map(([t,o],i)=>{const x=v[`${b.q.k}.${i}`]; return has(x)?`<tr><td>${esc(t)}</td><td>${esc(o[+x])}${b.q.k==='odi'?` <b>(${x})</b>`:''}</td></tr>`:'';}).join('');
    return ans ? `<table class="rep-table"><tbody>${ans}</tbody></table>` : '';
  }
  if (b.calc) { const r = CALC[b.calc](v); return r ? `<div class="calc ${r.lvl||''}" style="margin:6px 0">${r.html}</div>` : ''; }
  if (b.img) { const im = (s.images||{})[b.img]||[]; return im.length ? `<div class="rep-imgs">${im.map(src=>`<img src="${src}" alt="">`).join('')}</div>` : ''; }
  return '';
}
function keySummary(v) {
  const out = [];
  const rf = listRows('rf').filter((r,i)=>v['rf.'+i]==='yes');
  if (rf.length) out.push(`<div><b style="color:var(--red)">Red flags:</b> ${rf.map(r=>`<span class="tag pos">${esc(r[0])}</span>`).join('')}</div>`);
  const pos = [];
  stRows().forEach((r,i)=>{ const s=['L','R','C'].filter(x=>v[`st.${i}.${x}`]==='pos'); if (s.length) pos.push(`${r[0]}${s[0]!=='C'?' ('+s.join('/')+')':''}`); });
  if (pos.length) out.push(`<div><b>Positive special tests (${pos.length}):</b> ${pos.map(p=>`<span class="tag pos">${esc(p)}</span>`).join('')}</div>`);
  const weak = [];
  const mmtRows = listRows('mmt');
  mmtRows.forEach((r,i)=>{ [['L',0],['R',1]].forEach(([s,c])=>{ const g=v[`mmt.${i}.${c}`]; if (g && g!=='5' && g!=='NT') weak.push(`${r[0].split(' — ')[0]} ${s} ${g}/5`); }); });
  listRows('myo').forEach((r,i)=>{ [['L',0],['R',1]].forEach(([s,c])=>{ const g=v[`myo.${i}.${c}`]; if (g && g!=='5' && g!=='NT') weak.push(`${r[0]} ${s} ${g}/5`); }); });
  if (weak.length) out.push(`<div><b>Weakness:</b> ${weak.map(w=>`<span class="tag info">${esc(w)}</span>`).join('')}</div>`);
  const neuro = [];
  listRows('derm').forEach((r,i)=>{ [0,1,2,3].forEach(c=>{ const x=v[`derm.${i}.${c}`]; if (x && x!=='Normal') neuro.push(`${r[0]} ${['L LT','R LT','L PP','R PP'][c]}: ${x}`); }); });
  listRows('refl').forEach((r,i)=>{ [0,1].forEach(c=>{ const x=v[`refl.${i}.${c}`]; if (x && !x.startsWith('2+')) neuro.push(`${r[0]} ${c?'R':'L'}: ${x}`); }); });
  listRows('umn').forEach((r,i)=>{ [0,1].forEach(c=>{ const x=v[`umn.${i}.${c}`]; if (x==='Positive') neuro.push(`${r[0]} ${c?'R':'L'}: +`); }); });
  if (neuro.length) out.push(`<div><b>Neuro deficits:</b> ${neuro.map(w=>`<span class="tag pos">${esc(w)}</span>`).join('')}</div>`);
  const romLim = [];
  listRows('lrom').forEach((r,i)=>{ const a=v[`lrom.${i}.0`], l=v[`lrom.${i}.2`], p=v[`lrom.${i}.3`]; if ((l&&l!=='Full')||(p&&p!=='No pain')) romLim.push(`${r[0]}${a?' '+a+'°':''}${l&&l!=='Full'?' · '+l:''}${p&&p!=='No pain'?' · '+p:''}`); });
  if (romLim.length) out.push(`<div><b>Lumbar ROM:</b> ${romLim.map(w=>`<span class="tag info">${esc(w)}</span>`).join('')}</div>`);
  const sc = ['odi','sb','laslett','waddell','bmi','mri'].map(k=>CALC[k](v)).filter(Boolean);
  sc.forEach(r => out.push(`<div class="calc ${r.lvl||''}" style="margin:5px 0">${r.html}</div>`));
  return out.join('');
}
function buildReport(rec) {
  const v = rec.v || {};
  const date = v['pt.date'] ? new Date(v['pt.date']).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'}) : '';
  let html = `<div class="rep-banner"><div class="t">Joint Space Physiotherapy</div>
    <div class="s">Lumbar Spine / Back Assessment Proforma${date?' · '+esc(date):''}</div>
    <div style="margin-top:6px;font-size:13px"><b>${esc(v['pt.name']||'Patient')}</b>${v['pt.age']?' · '+esc(v['pt.age'])+' yrs':''}${v['pt.sex']?' · '+esc(v['pt.sex']):''}${v['pt.case']?' · Case '+esc(v['pt.case']):''}</div>
    ${v['dx.primary']?`<div style="margin-top:4px;font-size:12.5px;color:var(--blue);font-weight:800">Dx: ${esc(v['dx.primary'])}${v['dx.level']?.length?' — '+esc(v['dx.level'].join(', ')):''}${v['dx.side']?' ('+esc(v['dx.side'])+')':''}</div>`:''}</div>`;
  const ks = keySummary(v);
  if (ks) html += `<div class="rep-sec"><div class="rep-sec-head">★ Key findings summary</div><div class="rep-sec-body">${ks}</div></div>`;
  SECTIONS.forEach((s, n) => {
    let body = '', pendingHead = '';
    s.b.forEach(b => {
      if (b.h) { pendingHead = b.h; return; }
      if (b.note) return;
      const h = repBlock(b, v, rec);
      if (h) { if (pendingHead) { body += `<div class="rep-sub">${esc(pendingHead)}</div>`; pendingHead=''; } body += h; }
    });
    if (body) html += `<div class="rep-sec"><div class="rep-sec-head">${n+1}. ${esc(s.t)}</div><div class="rep-sec-body">${body}</div></div>`;
  });
  html += `<div class="sign-line"><div>Patient / guardian signature</div><div>${esc(v['sign.by']||'Physiotherapist')}${v['sign.qual']?', '+esc(v['sign.qual']):''}${v['sign.reg']?' · Reg '+esc(v['sign.reg']):''}</div></div>
  <div class="rep-foot">Joint Space Physiotherapy · Confidential Patient Record · Where Science Meets Movement</div>`;
  return html;
}
function openReport(rec) {
  $('#modal-title').textContent = (rec.v['pt.name'] || 'Patient') + ' — Back Assessment';
  $('#modal-body').innerHTML = buildReport(rec);
  $('#view-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeReport() { $('#view-modal').classList.remove('open'); document.body.style.overflow = ''; }

// ═════════════════════════════════════════════════════════════════
// RECORDS LIST
// ═════════════════════════════════════════════════════════════════
function renderRecords() {
  const q = ($('#rec-search').value || '').toLowerCase();
  const all = RECORDS.slice().sort((a,b)=>new Date(b.savedAt)-new Date(a.savedAt));
  const list = all.filter(r => !q || [r.v['pt.name'],r.v['pt.case'],r.v['dx.primary'],fmt(r.v['dx.level']||''),r.v['hx.cc'],r.v['pt.phone']].join(' ').toLowerCase().includes(q));
  const odis = all.map(r=>CALC.odi(r.v)?.val).filter(x=>x!=null);
  $('#rec-stats').innerHTML = `
    <div class="stat-mini"><div class="sm-val">${all.length}</div><div class="sm-lbl">Total saved</div></div>
    <div class="stat-mini"><div class="sm-val">${list.length}</div><div class="sm-lbl">Showing</div></div>
    <div class="stat-mini"><div class="sm-val">${odis.length?Math.round(odis.reduce((a,b)=>a+b,0)/odis.length)+'%':'—'}</div><div class="sm-lbl">Mean ODI</div></div>`;
  if (!list.length) { $('#records-list').innerHTML = `<div class="empty-state"><div style="font-size:42px">${all.length?'🔍':'📭'}</div><h3>${all.length?'No matches':'No assessments yet'}</h3>${all.length?'Try another search.':'Complete the assessment and tap Save.'}</div>`; return; }
  $('#records-list').innerHTML = list.map(r => {
    const v = r.v, odi = CALC.odi(v), sb = CALC.sb(v), rf = CALC.rf(v);
    const pos = stRows().map((row,i)=>['L','R','C'].some(s=>v[`st.${i}.${s}`]==='pos')?row[0]:null).filter(Boolean);
    const d = new Date(v['pt.date'] || r.savedAt).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
    return `<div class="rec-card">
      <div style="display:flex;gap:9px;align-items:flex-start"><span style="font-size:26px">🦴</span><div style="flex:1;min-width:0">
        <div class="rec-name">${esc(v['pt.name']||'Unnamed')}</div>
        <div class="rec-date">📅 ${esc(d)}${v['pt.therapist']?' · '+esc(v['pt.therapist']):''}</div></div></div>
      <div class="rec-tags">
        ${v['pt.case']?`<span class="rec-tag">Case ${esc(v['pt.case'])}</span>`:''}
        ${v['pt.age']?`<span class="rec-tag">${esc(v['pt.age'])} yrs${v['pt.sex']?' · '+esc(v['pt.sex']):''}</span>`:''}
        ${v['dx.primary']?`<span class="rec-tag blue">${esc(v['dx.primary'])}</span>`:''}
        ${odi?`<span class="rec-tag">ODI ${odi.val}%</span>`:''}
        ${sb?`<span class="rec-tag">STarT ${esc(sb.risk)}</span>`:''}
        ${rf?.lvl==='alert'?`<span class="rec-tag red">🚩 Red flags</span>`:''}
        ${pos.slice(0,4).map(p=>`<span class="rec-tag red">+${esc(p)}</span>`).join('')}${pos.length>4?`<span class="rec-tag red">+${pos.length-4} more</span>`:''}
      </div>
      ${v['hx.cc']?`<div style="font-size:12px;color:var(--ink3);font-style:italic;margin-bottom:8px">"${esc(v['hx.cc'].slice(0,120))}${v['hx.cc'].length>120?'…':''}"</div>`:''}
      <div class="rec-actions">
        <button class="rec-btn view" data-act="view" data-id="${r.id}">👁️ Report</button>
        <button class="rec-btn" data-act="edit" data-id="${r.id}">✎ Edit</button>
        <button class="rec-btn" data-act="reassess" data-id="${r.id}">↻ Re-assess</button>
        <button class="rec-btn del" data-act="del" data-id="${r.id}">🗑️</button>
      </div></div>`;
  }).join('');
}

// ═════════════════════════════════════════════════════════════════
// EXPORT / IMPORT
// ═════════════════════════════════════════════════════════════════
function download(name, data, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data],{type})); a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000); }
function exportCSV() {
  if (!RECORDS.length) return showToast('No records to export');
  const hdr = ['Name','Case no','Date','Age','Sex','Occupation','Chief complaint','Duration','NPRS current','NPRS worst','Diagnosis','Level','Side','ODI %','STarT Back','Red flags','Positive special tests','MRI summary','Therapist','Saved at'];
  const rows = RECORDS.map(r => { const v = r.v;
    const pos = stRows().map((row,i)=>{const s=['L','R','C'].filter(x=>v[`st.${i}.${x}`]==='pos');return s.length?row[0]+(s[0]!=='C'?' ('+s.join('/')+')':''):null;}).filter(Boolean);
    const rf = listRows('rf').filter((x,i)=>v['rf.'+i]==='yes').map(x=>x[0]);
    const mri = (CALC.mri(v)?.list||[]).map(s=>s.replace(/<[^>]+>/g,''));
    return [v['pt.name'],v['pt.case'],v['pt.date'],v['pt.age'],v['pt.sex'],v['pt.occ'],v['hx.cc'],v['hx.dur'],v['nprs.now'],v['nprs.worst'],v['dx.primary'],fmt(v['dx.level']||''),v['dx.side'],CALC.odi(v)?.val??'',CALC.sb(v)?.risk??'',rf.join(' | '),pos.join(' | '),mri.join(' | '),v['sign.by']||v['pt.therapist'],r.savedAt];
  });
  const csv = [hdr,...rows].map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""').replace(/\n/g,' ')+'"').join(',')).join('\n');
  download('JointSpace_Back_' + today() + '.csv', '﻿' + csv, 'text/csv');
  showToast('📥 CSV exported');
}
function exportJSON() {
  if (!RECORDS.length) return showToast('No records to back up');
  download('JointSpace_Back_Backup_' + today() + '.json', JSON.stringify(RECORDS), 'application/json');
  showToast('💾 Backup downloaded');
}
async function handleImport(e) {
  const file = e.target.files[0]; if (!file) return;
  try {
    const recs = JSON.parse(await file.text());
    if (!Array.isArray(recs)) throw 0;
    let n = 0;
    for (const r of recs) if (r && r.id && r.v && typeof r.v === 'object') { await dbPut(r); n++; }
    updateBadge(); renderRecords(); showToast(`✅ Restored ${n} record(s)`);
  } catch (err) { showToast('⚠️ Invalid backup file'); }
  e.target.value = '';
}

// ═════════════════════════════════════════════════════════════════
// IMAGES — downscaled to keep records small
// ═════════════════════════════════════════════════════════════════
let uploadTarget = null;
function readImage(file) {
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const max = 1400, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.82));
    }; img.onerror = () => res(null); img.src = fr.result; };
    fr.onerror = () => res(null); fr.readAsDataURL(file);
  });
}

// ═════════════════════════════════════════════════════════════════
// EVENTS
// ═════════════════════════════════════════════════════════════════
function openSection(id) { const c = $('#sec-'+id); c.classList.add('open'); c.scrollIntoView({ behavior:'smooth', block:'start' }); }
function switchPage(p) {
  $$('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.page === p));
  $$('.page').forEach(pg => pg.classList.toggle('active', pg.id === 'page-'+p));
  if (p === 'records') renderRecords();
  window.scrollTo({ top:0 });
}
function bind() {
  $$('.nav-tab').forEach(t => t.addEventListener('click', () => switchPage(t.dataset.page)));
  const form = $('#assessment-form');
  form.addEventListener('click', e => {
    const tg = e.target.closest('[data-toggle]');
    if (tg) { tg.parentElement.classList.toggle('open'); return; }
    const chip = e.target.closest('.chip');
    if (chip) {
      const box = chip.parentElement;
      if (box.dataset.multi) chip.classList.toggle('sel');
      else { const was = chip.classList.contains('sel'); $$('.chip', box).forEach(c=>c.classList.remove('sel')); if (!was) chip.classList.add('sel'); }
      recompute(); saveDraft(); return;
    }
    const pb = e.target.closest('.pn-btn');
    if (pb) {
      const box = pb.parentElement, v = box.dataset.val === pb.dataset.v ? '' : pb.dataset.v;
      box.dataset.val = v; $$('.pn-btn', box).forEach(b => b.classList.toggle('on', b.dataset.v === v));
      recompute(); saveDraft(); return;
    }
    const up = e.target.closest('[data-upload]');
    if (up) { uploadTarget = up.dataset.upload; $('#img-input').click(); return; }
    const del = e.target.closest('[data-delimg]');
    if (del) { const [g,i] = del.dataset.delimg.split('.'); IMAGES[g].splice(+i,1); renderImages(); saveDraft(); }
  });
  form.addEventListener('input', e => {
    if (e.target.dataset.nprs) { e.target.dataset.set = '1'; updNprs(e.target); }
    recompute(); saveDraft();
  });
  $('#img-input').addEventListener('change', async e => {
    for (const f of e.target.files) { const d = await readImage(f); if (d) IMAGES[uploadTarget].push(d); }
    e.target.value = ''; renderImages(); saveDraft(); showToast('📎 Image(s) added');
  });
  $('#sec-nav').addEventListener('click', e => { const b = e.target.closest('[data-jump]'); if (b) openSection(b.dataset.jump); });
  $('#btn-expand').onclick = () => $$('.section-card').forEach(c=>c.classList.add('open'));
  $('#btn-collapse').onclick = () => $$('.section-card').forEach(c=>c.classList.remove('open'));
  $('#btn-new').onclick = () => { if (confirm('Start a new blank assessment? Unsaved changes will be lost.')) { newForm(); showToast('New assessment'); } };
  $('#btn-clear').onclick = () => { if (confirm('Clear all form data?')) { newForm(); showToast('↺ Form cleared'); } };
  $('#btn-save').onclick = saveAssessment;
  $('#btn-report').onclick = () => openReport({ v: recompute(), images: IMAGES });
  $('#btn-close').onclick = closeReport;
  $('#btn-print').onclick = () => { document.body.classList.add('printing'); window.print(); };
  window.addEventListener('afterprint', () => document.body.classList.remove('printing'));
  $('#rec-search').addEventListener('input', renderRecords);
  $('#btn-csv').onclick = exportCSV;
  $('#btn-json').onclick = exportJSON;
  $('#btn-import').onclick = () => $('#import-file').click();
  $('#import-file').addEventListener('change', handleImport);
  $('#records-list').addEventListener('click', async e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const r = RECORDS.find(x => x.id === +b.dataset.id); if (!r) return;
    if (b.dataset.act === 'view') openReport(r);
    if (b.dataset.act === 'edit') { loadIntoForm(r.v, r.images, r.id); switchPage('form'); $$('.section-card').forEach(c=>c.classList.add('open')); showToast('✎ Editing ' + (r.v['pt.name']||'record')); }
    if (b.dataset.act === 'reassess') {
      const keep = {}; Object.keys(r.v).filter(k=>k.startsWith('pt.')||k.startsWith('pmh.')).forEach(k=>keep[k]=r.v[k]);
      keep['pt.date'] = today(); keep['sign.date'] = today();
      keep['hx.hopi'] = `Re-assessment. Previous assessment ${r.v['pt.date']||''}${r.v['dx.primary']?' — '+r.v['dx.primary']:''}${CALC.odi(r.v)?' — ODI '+CALC.odi(r.v).val+'%':''}.`;
      loadIntoForm(keep, null, null); switchPage('form'); showToast('↻ Re-assessment started');
    }
    if (b.dataset.act === 'del' && confirm('Delete this assessment permanently?')) { await dbDel(r.id); if (currentId === r.id) setEditing(null); updateBadge(); renderRecords(); showToast('🗑️ Deleted'); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeReport(); });
}

// INIT
buildForm();
bind();
initDB().then(() => {
  updateBadge();
  const d = loadDraft();
  if (d && d.v && Object.keys(d.v).some(k => k !== 'pt.date' && k !== 'sign.date')) {
    loadIntoForm(d.v, d.images, RECORDS.some(r=>r.id===d.id) ? d.id : null);
    showToast('📝 Unsaved draft restored');
  } else newForm();
  $('#sec-pt').classList.add('open');
});
</script>
